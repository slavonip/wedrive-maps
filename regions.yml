# What the factory produces, and how each thing it produces is proved.
#
# A package is what a car installs: one basemap and one routing graph, built together. A
# single-country package is simply a list of one.
#
# Adding a country is one entry under `packages` AND one under `countries`. The second half is
# not optional and the gate enforces it: a package containing a country with no probes is
# refused before the build starts (scripts/probe-plan.py), because the alternative is a country
# arriving in the car with nothing but "it built" behind it. That is exactly what happened to
# Romania in the first md-ro build — it sat inside a package whose every probe pointed at
# Chișinău, so the Romanian half was tested by nothing at all.
#
# `regions` are Geofabrik paths under https://download.geofabrik.de/ — the same source the
# routing tiles and the basemap both come from, so the two halves of a package cannot drift to
# different vintages.

# NAMED packages are the ones built every month, unattended. They are a short list on purpose:
# N countries have 2^N subsets and the car drives a handful of them.
#
# ANY OTHER COMBINATION IS BUILT ON DEMAND WITHOUT EDITING THIS FILE. A package id that is not
# listed here but reads as country codes joined by dashes — `md-ro-ua`, `ro-hu` — is derived
# from the `countries:` block below: its regions are those countries' Geofabrik paths and its
# probes are those countries' probes plus the border routes between them. So planning a trip
# through a country the car has never carried is `workflow_dispatch` with `md-ro-ua`, not a
# commit. Adding a COUNTRY is the real cost, and it is paid once.
packages:
  md:
    title: Moldova
    countries: [MD]

  md-ro:
    title: Moldova + Romania
    countries: [MD, RO]

# ── What must hold INSIDE each country ──────────────────────────────────────────────────────
#
# Three properties per country, each chosen because a graph can lose it while still building,
# downloading and routing — which is every way this can go wrong silently:
#
#   bbox              [W, S, E, N] from Geofabrik's index-v1.json — the box the BASEMAP is cut
#                     to. A package's box is the union of its countries'.
#   timezone          the IANA zone written into the nodes at build time. Lose it and routes are
#                     fine while every cross-border arrival time is an hour out, in winter only.
#   oneway            [from_lat, from_lon, to_lat, to_lon] along a one-way street. Going against
#                     it must cost materially more, because the car has to go round.
#   grade_separation  [lat, lon, lat, lon, straight_line_m] for a point on a bridge and a point
#                     on the road beneath. They share no OSM node, so no turn between them
#                     exists and the car must drive round.
#
# ABSOLUTE DISTANCES ARE NOT ASSERTED, deliberately. §7's August 2026 numbers (322 m / 681 m on
# Pușkin) no longer hold on a 2026-09 extract — the same street answers 622 m / 1004 m because
# OSM was edited — and a gate that failed on that would be failing a graph that is behaving
# perfectly. What is asserted is the RELATIONSHIP, which an OSM edit cannot break and a broken
# tile build cannot fake.
#
# Coordinates come from scripts/find-probes.py, which asks OSM for junctions with the property
# rather than asking a person to remember one. The Moldova bridge probe spent a morning pointing
# at Strada Visterniceni — a junction that is genuinely connected — because those coordinates
# were typed from memory.

countries:
  MD:
    name: Moldova
    region: europe/moldova
    # From Geofabrik's own index-v1.json, so the basemap is cut to the same ground the routing
    # extract covers. Two halves of a package cut to different boxes is a road you can route
    # along and cannot see — or the reverse, which reads as "the app is broken".
    bbox: [26.61, 45.46, 30.19, 48.49]
    timezone: Europe/Chisinau
    timezone_at: [47.0105, 28.8638]                  # Chișinău, city centre
    # Strada Alexandr Pușkin — §7's original one-way measurement, 2026-08-29
    oneway: [47.0246, 28.8320, 47.0209, 28.8331]
    # Bulevardul Renașterii Naționale (OSM way 24776845, bridge=yes layer=2)
    # over Strada Calea Moșilor (way 726144970)
    grade_separation: [47.0352, 28.8480, 47.0348, 28.8483, 53]

  RO:
    name: Romania
    region: europe/romania
    bbox: [20.24, 43.61, 30.28, 48.27]
    timezone: Europe/Bucharest
    timezone_at: [47.1585, 27.6014]                  # Iași
    # Strada Morilor, Iași (OSM way 22970064), 402 m one-way
    oneway: [47.160518, 27.577725, 47.157058, 27.577536]
    # Pasaj Nicolina, Iași — the owner pointed at this one from the satellite view, and the
    # router agrees it is the strongest in the city: 1352 m of driving round a 26 m gap, 52×.
    #
    # TWO EARLIER CANDIDATES WERE REJECTED, and both rejections are the same lesson. Trecătoarea
    # Nucului (9 m) had both points snapping to ONE edge, so the router answered 9 m. Bulevardul
    # Tudor Vladimirescu over Mangeron (25 m) snapped perfectly to two different ways and still
    # answered 35 m — because it is an interchange and the turn really is legal there. In OSM
    # tags the three are indistinguishable. Only a route tells them apart, which is what
    # scripts/verify-candidates.py is for.
    grade_separation: [47.144962, 27.582142, 47.144948, 27.582485, 26]

  UA:
    name: Ukraine
    region: europe/ukraine
    bbox: [22.13, 44.01, 40.24, 52.39]
    # Europe/KYIV, not Europe/Kiev. Asked of the vendored 2024a database rather than typed from
    # memory — the rename landed in tzdata 2022b and both spellings are still in circulation.
    timezone: Europe/Kyiv
    timezone_at: [50.4501, 30.5234]                  # Kyiv
    # Вознесенський узвіз (OSM way 729978619), 402 m one-way
    oneway: [50.459972, 30.505928, 50.462681, 30.506632]
    # Венеційський міст, 73 m above the way beneath it. UNVERIFIED BY ROUTER: OSM tags cannot
    # tell a grade separation from an interchange, so the first build that contains Ukraine is
    # what confirms it. A failing probe here means swapping in the next candidate from
    # candidates-ua.json, not that the graph is broken.
    grade_separation: [50.447646, 30.575772, 50.44705, 30.5762, 73]

  HU:
    name: Hungary
    region: europe/hungary
    bbox: [16.11, 45.73, 22.91, 48.59]
    timezone: Europe/Budapest
    timezone_at: [47.4979, 19.0402]                  # Budapest
    # Gubacsi út (OSM way 314724946), 401 m one-way
    oneway: [47.462230, 19.084799, 47.465331, 19.082089]
    # Váci út, 80 m. UNVERIFIED BY ROUTER — see UA above.
    grade_separation: [47.595247, 19.08924, 47.595691, 19.090075, 80]

  AT:
    name: Austria
    region: europe/austria
    bbox: [9.53, 46.37, 17.16, 49.02]
    timezone: Europe/Vienna
    # Penzing, NOT Stephansplatz. The city-centre coordinate is correct about Austria and useless
    # as a probe: the timezone and admin probes route from the point to one 500 m away, and
    # Vienna's core is pedestrianised, so a car route between two points inside it does not exist.
    # The graph was right all along — the diagnostic read `Europe/Vienna` off 20 edges at the old
    # coordinate, in the master and in the cut alike — and the probe was reporting "no timezone"
    # for what was actually "no route". A PROBE COORDINATE MUST ROUTE LOCALLY, which is a
    # different requirement from being in the right country.
    timezone_at: [48.1950, 16.2700]                  # Vienna (Penzing) — routes 2.04 km
    # Urselbrunnengasse (OSM way 365841141), 400 m one-way
    oneway: [48.166483, 16.392700, 48.169012, 16.396515]
    # Hochstraße St. Marx over Litfaßstraße, 79 m. UNVERIFIED BY ROUTER — see UA above.
    grade_separation: [48.187644, 16.408707, 48.18726, 16.409606, 79]

  BG:
    name: Bulgaria
    region: europe/bulgaria
    bbox: [22.35, 41.23, 29.19, 44.22]
    timezone: Europe/Sofia
    timezone_at: [42.6977, 23.3219]                  # Sofia
    # бул. Владимир Вазов (OSM way 23222938), 400 m one-way
    oneway: [42.708914, 23.372637, 42.709792, 23.377379]
    # Липите over Породин, 80 m. UNVERIFIED BY ROUTER until a build contains Bulgaria.
    grade_separation: [42.794786, 23.330232, 42.794224, 23.330842, 80]

  GR:
    name: Greece
    region: europe/greece
    bbox: [18.97, 34.59, 29.66, 41.75]
    timezone: Europe/Athens
    timezone_at: [37.9838, 23.7275]                  # Athens
    # Ναυπάκτου (OSM way 24814935), 400 m one-way
    oneway: [37.878134, 23.771462, 37.874543, 23.771622]
    # Βουλιαγμένης over Θράκης, 62 m. UNVERIFIED BY ROUTER until a build contains Greece.
    grade_separation: [37.889356, 23.748789, 37.889367, 23.749499, 62]
# ── What must hold BETWEEN countries in the same package ────────────────────────────────────
#
# THE probe the multi-PBF build exists for. Measured 2026-09-17: two countries built separately
# cannot be merged — 35 tile paths are shared between a Moldova build and a Romania build, 0 of
# them byte-identical, and all three of Moldova's level-0 tiles are overwritten by Romania's. So
# a package claiming two countries has to be built in ONE pass over both PBFs, and this route is
# how we find out whether it was.
#
# Every ADJACENT pair in a package needs an entry. A pair that shares no border needs none —
# Moldova and Bulgaria in one package would route through Romania or not at all, and neither
# answer says anything about the tile build — so `adjacent: false` states that explicitly rather
# than leaving a hole the coverage check cannot tell from an oversight.

borders:
  MD-RO:
    from: [47.0105, 28.8638]        # Chișinău
    to: [47.1585, 27.6014]          # Iași
    min_km: 100                     # measured 150.1 km via Ungheni/Sculeni. A graph cut at the
    max_km: 250                     # frontier gives NO route at all, not a shorter one

  MD-UA:
    from: [47.0105, 28.8638]        # Chișinău
    to: [46.4825, 30.7233]          # Odesa
    min_km: 120
    max_km: 320

  RO-UA:
    from: [47.1585, 27.6014]        # Iași
    to: [48.2921, 25.9358]          # Chernivtsi, via Siret
    min_km: 150
    max_km: 450

  HU-RO:
    from: [47.0722, 21.9217]        # Oradea
    to: [47.5316, 21.6273]          # Debrecen
    min_km: 50
    max_km: 220

  HU-UA:
    from: [47.5316, 21.6273]        # Debrecen
    to: [48.6208, 22.2879]          # Uzhhorod
    min_km: 120
    max_km: 380

  AT-HU:
    from: [47.4979, 19.0402]        # Budapest
    to: [48.2082, 16.3738]          # Vienna
    min_km: 180
    max_km: 380

  # END TO END, and the most valuable probe in the file. Chișinău to Vienna crosses four
  # frontiers and every country in the super-region; a route of the right length proves the
  # whole thing was stitched in one pass, which is the property per-country cuts depend on.
  AT-MD:
    from: [47.0105, 28.8638]        # Chișinău
    to: [48.2082, 16.3738]          # Vienna
    min_km: 1100
    max_km: 2000

  BG-RO:
    from: [43.8563, 25.9660]        # Giurgiu, on the Danube
    to: [43.8356, 25.9657]          # Ruse, the far bank
    min_km: 2                       # the Friendship Bridge is barely 3 km end to end, which
    max_km: 40                      # makes this the shortest frontier probe in the file

  BG-GR:
    from: [41.1354, 24.8888]        # Drama
    to: [41.1400, 24.1400]          # Serres, via the Promachonas crossing
    min_km: 40
    max_km: 220

  # GREECE REACHES THE REGION THROUGH BULGARIA ONLY. Its other land neighbours in this set do
  # not exist — there is no Greek frontier with Romania, Hungary, Austria or Moldova — so a route
  # to any of them passes through Bulgaria, whose own border probe already covers that ground.
  GR-HU: {adjacent: false}
  GR-MD: {adjacent: false}
  GR-RO: {adjacent: false}
  AT-GR: {adjacent: false}
  AT-BG: {adjacent: false}
  BG-HU: {adjacent: false}
  BG-MD: {adjacent: false}
  BG-UA: {adjacent: false}
  GR-UA: {adjacent: false}

  # NOT ADJACENT, stated rather than left silent — silence is indistinguishable from an
  # oversight, and the coverage gate refuses a pair it has never been told about. A route
  # between these does exist inside the region; it simply says nothing about tile building,
  # because it passes through a third country whose own border probe already covers it.
  AT-RO: {adjacent: false}
  AT-UA: {adjacent: false}
  HU-MD: {adjacent: false}


# ── CORRIDORS: the probes that only a CONTINENTAL graph can pass ───────────────────────────
#
# A border probe is short by design — Chișinău to Iași, one frontier, a few tiles either side.
# That is exactly right for "did these two countries join", and it cannot ask the question a
# Europe-wide build raises for the first time: **is this ONE graph?**
#
# The reason is the hierarchy stage. Level-0 tiles span the whole build, and a route is planned
# on them only when it is long enough to need them. Every probe the factory had before this
# stayed on level 2 — so the tiles that make a continental graph continental were built, shipped
# and never once used by anything that could tell whether they were right.
#
# Each corridor asserts four separate things, and each can be wrong while the others look fine:
#
#   a route exists            the chain of frontiers is joined end to end
#   its length is sane        it did not detour through a country it should have driven across
#   its geometry is CONTINUOUS   the only check that sees a teleport with a plausible distance
#   it passed through `through`  a right-length continuous route can still have gone round
#
# The third is not theoretical. Two independently built masters answered a Romania → Hungary
# route with 937 km in 12.04 h at 78 km/h — every summary figure in range — carrying a 294.89 km
# jump inside its own geometry, from 47.1587,23.8874 to 47.2186,19.9856. Only the shape knew.
#
# BOUNDS ARE DELIBERATELY WIDE. §"absolute distances are the wrong assertion" applies here as
# everywhere: these exist to catch "it went via somewhere else entirely" and "it did not go at
# all", not to pin a number an ordinary OSM edit would move. A motorway opening should never
# fail this gate.

corridors:
  AT-MD-long:
    name: Vienna → Chișinău, across four countries
    from: [48.2082, 16.3738]        # Vienna
    to: [47.0105, 28.8638]          # Chișinău
    through: [AT, HU, RO, MD]
    min_km: 1100
    max_km: 1900

  GR-HU-long:
    name: Athens → Budapest, up the eastern spine
    from: [37.9838, 23.7275]        # Athens
    to: [47.4979, 19.0402]          # Budapest
    # Serbia is not in this build, so the only way north is GR → BG → RO → HU. That makes this
    # corridor a stronger assertion than it looks: if any one of those three frontiers failed to
    # join, there is no alternative for the router to quietly take instead.
    through: [GR, BG, RO, HU]
    min_km: 1300
    max_km: 2300

  MD-BG-long:
    name: Chișinău → Sofia, down through Romania
    from: [47.0105, 28.8638]        # Chișinău
    to: [42.6977, 23.3219]          # Sofia
    through: [MD, RO, BG]
    min_km: 550
    max_km: 1200

  AT-UA-long:
    name: Vienna → Odesa, the length of the build
    from: [48.2082, 16.3738]        # Vienna
    to: [46.4825, 30.7233]          # Odesa
    # Ukraine may be entered from Hungary or from Romania and both are legitimate, so it is not
    # named in `through`: asserting a particular way round would fail a healthy graph the day a
    # router preference changed. What is asserted is that it reaches Ukraine at all.
    through: [AT, HU, UA]
    min_km: 1300
    max_km: 2400

# ── SUPER-REGIONS: one build, cut into countries afterwards (2026-09-17) ────────────────────
#
# THE ORDER IS THE WHOLE POINT, and it is the opposite of `packages:` above. A package is built
# from its own PBFs and shipped whole. A super-region is built ONCE over every country in it and
# then CUT along national boundaries, which is how Sygic and HERE ship per-country downloads that
# still route across borders.
#
# Measured on md-ro before any of this was written (`scripts/cut-by-country.py`):
#
#   Moldova's cut alone : Chișinău → Bălți 137.9 km, Chișinău → Bucharest NO ROUTE
#   both cuts assembled : Chișinău → Bucharest 456.5 km — identical to the whole build
#   timezones survive   : Europe/Chisinau and Europe/Bucharest, correct per country
#   cost of the overlap : 36 shared tiles, 1.11x the whole build across both cuts
#
# A frontier tile belongs to both countries as the SAME FILE, which is the entire difference
# from merging two separate builds (35 shared paths, 0 byte-identical, measured the same day).
#
# THE RULE THIS BUYS AND THE RULE IT COSTS. Adding a country then costs that country's tiles
# rather than a rebuilt package, and removing one is a delete. But `GraphId` carries an index
# assigned during the build, so EVERY installed country must come from the same build — mixing
# vintages gives edges pointing at the wrong nodes, silently. Hence `buildId`, and hence a
# monthly update still replaces everything the car holds.
#
# Choose the membership generously: adding a country changes the build and therefore obsoletes
# every cut. All of Europe is the destination; 32.6 GB of PBF against a runner's 6-hour limit is
# why it is not the starting point.

superregions:
  eu-core:
    title: Central and Eastern Europe
    # UKRAINE IS OUT FOR NOW, for two reasons that happen to agree. The owner is not driving
    # there in the near future (2026-09-17), and the five-country build CRASHED —
    # `valhalla_build_tiles` aborted on level-2 tiles around Budapest with
    # `vector::_M_range_check` against an empty vector, exit 134.
    #
    # The obvious suspicion was Hungarian data, and it was WRONG: Hungary alone builds clean,
    # 231 tiles, every probe green. What differed was scale — 2287 tiles against 231 — and
    # Ukraine is by far the largest member at 837 MB of PBF. So dropping it tests the remaining
    # hypothesis and delivers what was asked, in one run.
    #
    # If four countries build, the next question is whether Ukraine alone does, and only then
    # whether the crash is about total size or about one country's data. Do not put it back
    # without that answer.
    countries: [AT, HU, MD, RO]

  europe:
    title: Europe
    # ── ONE SOURCE, NOT A LIST OF THEM ──────────────────────────────────────────────────────
    # `source` makes this region build from a SINGLE Geofabrik extract covering everything, with
    # no merge stage at all. eu-core merges four country PBFs with `osmium merge`; this does not,
    # because Geofabrik already publishes the merged article and merging 32.6 GB from parts would
    # be work done twice and a second chance to get it wrong.
    #
    # The countries below are therefore the CUT LIST, not the ingredient list. Every one of them
    # is built from the same continental graph whether it is listed or not — listing it is what
    # produces a downloadable artifact for it.
    source: europe
    #
    # SEVEN COUNTRIES, AND THE LIST IS SHORT ON PURPOSE. Europe has forty-odd; these are the ones
    # that carry a timezone, a one-way, a grade separation and a border route for every pair —
    # which is to say, the ones a gate can actually assert. Cutting the rest would ship graphs
    # nothing had ever checked, and "the gate was running the probes it had" is precisely the
    # failure this project has already made once and written down.
    #
    # Adding one later costs `add-country.py` plus a rebuild, because a GraphId index belongs to
    # its build and cuts cannot be mixed across vintages. That is a known price, not an oversight.
    countries: [AT, BG, GR, HU, MD, RO, UA]
