# What the factory produces. One entry per PACKAGE, not per country.
#
# A package is what a car installs: one basemap and one routing graph, built together. A
# single-country package is simply a list of one, which is why this shape survives whichever way
# the border measurement goes — if separately-built countries turn out not to join at the
# frontier, multi-country packages are the only way to drive across one, and nothing here has to
# change except the lists below.
#
# Adding a country is one entry. The workflow does the rest: fetch, build, probe, checksum,
# publish, and only then promote.
#
# `regions` are Geofabrik paths under https://download.geofabrik.de/ — the same source the
# routing tiles and the basemap both come from, so the two halves of a package cannot drift to
# different vintages.

packages:
  md:
    title: Moldova
    countries: [MD]
    regions:
      - europe/moldova

  md-ro:
    title: Moldova + Romania
    countries: [MD, RO]
    regions:
      - europe/moldova
      - europe/romania

  # Deliberately not enumerated further until the car actually needs them: thirty countries have
  # a billion subsets, and the factory builds the handful that match how this car is driven.
  # md-ro-ua, ro-bg and the rest are added the day a trip needs them.
