#cloud-config
# WHAT A FRESH BUILDER DOES TO ITSELF, before GitHub has said a word to it.
#
# Created by the Hetzner API with this as `user_data`. It boots, installs the little it needs,
# registers as an EPHEMERAL runner via a JIT config, takes exactly one job, and deregisters.
#
# Placeholders filled by `hetzner.py create`, which is the only code that knows which rung of the
# ladder won:   __RUNNER_VERSION__  __ARCH__  __JIT_CONFIG__  __SSH_PUBKEY__
#
# ── TWO FAILURES SHAPED THIS FILE, AND NEITHER WAS DIAGNOSABLE AT THE TIME ─────────────────────
#
# The first ended with `su - runner -c "./run.sh --jitconfig ..." &`. cloud-init executes runcmd
# from a systemd service, and when that service finishes systemd cleans up its cgroup — taking
# anything backgrounded from inside it. The runner was started and killed by design.
#
# The second used a systemd unit, which was right, and still did not connect. That machine had a
# journal explaining why, and cleanup deleted it ten seconds later. The logs existed and were
# unreachable: the same blindness in better clothes.
#
# So this version does two things differently. Every stage records PASS or FAIL to
# /var/log/wedrive-stages before moving on, so the LAST SUCCESSFUL STAGE is always known. And an
# ephemeral public key is installed, so the workflow can SSH in and read those files before the
# machine is destroyed — the private half exists only inside one GitHub job and is never stored,
# never uploaded to Hetzner, and never leaves that job.
#
# WHAT IS DELIBERATELY *NOT* INSTALLED: Valhalla, osmium, spatialite, python libraries. Those live
# in a version-pinned container image, because a builder that installs its toolchain from a
# distribution's repositories is a builder whose output changes when that distribution updates.

# ── MEASURED, THIRD PAID ATTEMPT, 2026-09-18 ─────────────────────────────────────────────────
# The diagnostic SSH path authenticated by key and was then refused by the login itself:
#
#     You are required to change your password immediately (administrator enforced).
#     WARNING: Your password has expired.
#     Password change required but no TTY available.
#
# Hetzner's image marks root's password expired when a server is created without a stored SSH key
# resource. That blocks every non-interactive session — which is what a diagnostic dump is.
#
# THE FIX IS A SEPARATE USER, NOT A SYSTEM-WIDE POLICY CHANGE. Turning the expiry off globally
# (`chpasswd: expire: false`) would very likely also repair `su - runner` — and that is precisely
# why it is not done here. The next run has to OBSERVE the machine that fails, not a repaired one,
# or a green result tells us nothing about which change mattered.
#
# So a dedicated account exists only to be logged into: created by cloud-init's `users` module,
# key-only, with a locked password rather than an expired one, and passwordless sudo so the dump
# can read root-owned logs. It changes nothing about how the runner is installed or started.
ssh_pwauth: false

package_update: true
packages:
  - docker.io
  - curl
  - jq
  - tar
  - psmisc

# Ephemeral, for diagnosis only. Generated per run, used within one job, destroyed with the
# machine, and NOT stored as a Hetzner SSH key resource — there is no long-lived credential
# anywhere in this path.
#
# `lock_passwd: true` gives this account no password at all, which is a different state from
# root's EXPIRED one: PAM refuses an expired password on the account phase even when the key
# authenticated, and accepts a locked one. That distinction is the whole reason the diagnostics
# could not be read last time.
users:
  - default
  - name: diagnostic
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __SSH_PUBKEY__

write_files:
  - path: /usr/local/bin/bootstrap-runner
    permissions: "0755"
    encoding: b64
    content: __BOOTSTRAP_B64__

  - path: /etc/systemd/system/github-runner.service
    permissions: "0644"
    content: |
      [Unit]
      Description=GitHub Actions ephemeral runner
      After=network-online.target docker.service
      Wants=network-online.target
      # Bounded restarts, declared here so the policy below cannot loop forever.
      StartLimitIntervalSec=300
      StartLimitBurst=3

      [Service]
      Type=simple
      User=runner
      WorkingDirectory=/opt/runner
      ExecStart=/opt/runner/run.sh --jitconfig __JIT_CONFIG__
      # `on-failure`, not `no`. A runner that dies to a transient condition during boot — the
      # network not quite up, a slow DNS — should try again rather than leave a machine billing
      # with nothing on it. Three attempts in five minutes, then it stays dead and the
      # self-destruct timer takes the machine.
      #
      # This CANNOT hide a broken install, because the install is checked before the unit starts:
      # `bootstrap-runner` records runner_present and dependencies as PASS or FAIL, and a restart
      # loop against a missing run.sh would be visible as exactly that in the stage file.
      Restart=on-failure
      RestartSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  # A last-resort expiry ON THE MACHINE ITSELF, independent of GitHub being reachable. The
  # watchdog is the real guarantee; this one still works when GitHub is not.
  - path: /usr/local/bin/self-destruct
    permissions: "0755"
    content: |
      #!/bin/sh
      # If the runner unit is not active and the machine has been up an hour, nothing is ever
      # going to happen here. The first version tested a marker file that runcmd created
      # unconditionally, so it could never fire — in exactly the situation it existed to prevent.
      systemctl is-active --quiet github-runner && exit 0
      UPTIME=$(cut -d. -f1 /proc/uptime)
      [ "$UPTIME" -gt 3600 ] && poweroff
      exit 0

  - path: /etc/systemd/system/self-destruct.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Power off a builder that never got a job
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/self-destruct

  - path: /etc/systemd/system/self-destruct.timer
    permissions: "0644"
    content: |
      [Unit]
      Description=Power off a builder that never got a job
      [Timer]
      OnBootSec=20min
      OnUnitActiveSec=10min
      [Install]
      WantedBy=timers.target

# One entry, on purpose. Everything it does is in `bootstrap-runner`, where each stage is
# recorded — rather than spread across runcmd lines whose individual outcomes vanish.
runcmd:
  - /usr/local/bin/bootstrap-runner
