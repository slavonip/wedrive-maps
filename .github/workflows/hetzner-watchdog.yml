name: hetzner watchdog

# THE GUARANTEE THAT DOES NOT DEPEND ON THE BUILD SURVIVING.
#
# The europe build deletes its own machine in a cleanup job with `if: always()`, which covers a
# failed build, a cancelled run and a crashed builder. It does NOT cover the cleanup job itself
# never running: a cancelled workflow, a GitHub incident, a runner that vanishes mid-job. In those
# cases a machine keeps billing by the hour with nobody watching, and for a MONTHLY job "nobody
# watching" means until the invoice.
#
# So every server is born with an `expires` label and this sweeps what is past it, hourly, from a
# free runner that has nothing to do with the build. The two mechanisms fail independently, which
# is the only reason having both is worth anything.
#
# It deletes only servers carrying BOTH of our labels AND a readable expiry that has passed. A
# server of ours with no expiry label is reported and left alone — guessing at intent is how a
# sweeper destroys a running build.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deleted, delete nothing"
        type: boolean
        default: false

concurrency:
  group: hetzner-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: delete anything of ours that has outlived its expiry
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          if [ -z "$HETZNER_API_TOKEN" ]; then
            echo "::error::HETZNER_API_TOKEN is not set — the watchdog is blind and a leaked"
            echo "::error::server would bill unnoticed. This is a failure, not a skip."
            exit 1
          fi
          python3 scripts/hetzner.py sweep \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/sweep.txt

      # A deletion is worth an annotation on the run, because it means something upstream failed
      # to clean up after itself and that is worth knowing about.
      - name: say so if anything was swept
        if: always()
        run: |
          if grep -q "DELETED" /tmp/sweep.txt 2>/dev/null; then
            echo "::warning::the watchdog deleted a leaked builder — a cleanup job failed to run"
          fi
          {
            echo "### watchdog"
            echo '```'
            cat /tmp/sweep.txt 2>/dev/null || echo "the sweep did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
