name: regional factory

# Региональная фабрика: одна страна — один пакет, границы — отдельные таблицы порталов.
# Приложение читает manifest.json (RegionalManifest.kt); это единственный указатель этой схемы.
#
#   precheck -> factory -> publish (verify | publish) -> report (issue при сбое production)
#
# precheck   что пересобрать и почему: MD5 экстракта Geofabrik, движок (regional-engine.lock),
#            база часовых поясов; неизменные страны ПЕРЕНОСЯТСЯ, а не собираются заново. Ничего не
#            изменилось -> прогон заканчивается без релиза.
# factory    контейнер = движок ПО DIGEST; сборка изменённых стран, перенос остальных с проверкой
#            sha, распаковка набора, ВСЕ таблицы порталов, регрессия на собранном наборе
#            (швы, потеря региона, км), gzip -n + части, манифест с происхождением.
# publish    draft -> выкладка -> скачать обратно и сверить -> (verify: удалить черновик) |
#            (publish: опубликовать -> проверить все URL манифеста -> коммит manifest.json).
#
# Порядок не случаен. Манифест — это обещание устройству; переключать его до регрессии и до
# проверки выложенного значит обещать то, что не проверено.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = собрать и проверить; verify = ещё и выложить черновик, скачать обратно, удалить; publish = production (только полный набор)"
        type: choice
        options: [dry, verify, publish]
        default: dry
      countries:
        description: "Какие страны в наборе (через запятую). Пусто = все из regional.json. Неполный набор не публикуется."
        required: false
        default: ""
      rebuild:
        description: "auto = по изменениям источников; all = все; или список (RO,HU)"
        required: false
        default: "auto"
      part_bytes:
        description: "Порог разрезания пакета, байт. Пусто = 1.9 ГиБ (предел актива GitHub). Меньше — проверить механику на небольшой стране."
        required: false
        default: ""
  # Monthly, enabled 2026-09-26 after control runs MD, MD+RO, all five (verify) and the first
  # production run 36200018901 (regional-2026-09-26-13). The 4th at 03:17 UTC: a day after Europe
  # Lite (3rd, 03:17) so the two heavy factories never share an evening, and outside Geofabrik's
  # publishing window, when -latest and its .md5 can disagree for tens of minutes. A scheduled run
  # is mode=publish; precheck ends it without a release when no source changed.
  schedule:
    - cron: '17 3 4 * *'

concurrency:
  group: regional-factory
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  WORK: /data/regional

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.plan.outputs.go }}
      mode: ${{ steps.mode.outputs.mode }}
      countries: ${{ steps.plan.outputs.countries }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
      rebuild_json: ${{ steps.matrix.outputs.rebuild_json }}
      carry: ${{ steps.plan.outputs.carry }}
      complete: ${{ steps.plan.outputs.complete }}
      image: ${{ steps.plan.outputs.image }}
      engine_ref: ${{ steps.plan.outputs.engine_ref }}
      engine_sha: ${{ steps.plan.outputs.engine_sha }}
      timezones_url: ${{ steps.plan.outputs.timezones_url }}
      timezones_sha256: ${{ steps.plan.outputs.timezones_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: tests of the regional scripts
        run: |
          python3 tests/test_regional.py
          python3 tests/test_frontier.py
          python3 tests/test_features.py
      - name: mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mode="$INPUT_MODE"; [ "$EVENT" = schedule ] && mode=publish
          echo "mode=${mode:-dry}" >> "$GITHUB_OUTPUT"; echo "mode: ${mode:-dry}"
      - name: what to rebuild, and why
        id: plan
        env:
          COUNTRIES: ${{ inputs.countries }}
          REBUILD: ${{ inputs.rebuild || 'auto' }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python3 scripts/regional-precheck.py regional.json regional-engine.lock manifest.json \
            --countries "$COUNTRIES" --rebuild "$REBUILD" --github-output "$GITHUB_OUTPUT"
          complete=$(grep '^complete=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$MODE" = publish ] && [ "$complete" != true ]; then
            echo "::error::publish needs the whole set of regional.json; a partial set is a control run (dry or verify)"
            exit 1
          fi
      - name: the rebuilt countries as a matrix for the basemap job
        id: matrix
        run: |
          rb=$(grep '^rebuild=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "rebuild_json=$(python3 -c 'import json,sys;print(json.dumps([c for c in sys.argv[1].split(",") if c]))' "$rb")" >> "$GITHUB_OUTPUT"

  # ── BASEMAP + SEARCH of every rebuilt country, in parallel: what the driver sees (Protomaps
  # pmtiles) and what he searches (SQLite FTS4 index, Search v2). Built with the country, so a
  # country version is graph + frontier + features + map + search of one monthly run; a carried
  # country keeps the map and search of the release it came from. The factory job gets only the
  # small descriptors (sizes and hashes for the manifest); the files go to the publish job.
  basemap:
    needs: precheck
    if: needs.precheck.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: true
      matrix:
        code: ${{ fromJSON(needs.precheck.outputs.rebuild_json) }}
    steps:
      - uses: actions/checkout@v4
      - name: disk
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android || true
          df -h / | tail -1
      - name: map and search index
        env:
          CODE: ${{ matrix.code }}
        run: |
          set -euo pipefail
          low=$(echo "$CODE" | tr '[:upper:]' '[:lower:]')
          box=$(python3 -c 'import json,sys;print(" ".join(str(x) for x in json.load(open("regional.json"))["countries"][sys.argv[1]]["bbox"]))' "$CODE")
          mkdir -p "$RUNNER_TEMP/out"
          # shellcheck disable=SC2086
          OUT_DIR="$RUNNER_TEMP/out" WORK="$RUNNER_TEMP" bash scripts/build-basemap.sh "$low" $box
          # build-index.py already wrote Search v2 (search_db.py: aliases as a JSON array, the
          # accepted encoding). NOT index-to-sqlite.py: that is the rejected space-joined prototype.
          mv "$RUNNER_TEMP/out/$low-index.sqlite" "$RUNNER_TEMP/out/$low.search.sqlite"
          rm -f "$RUNNER_TEMP/out/$low-index.json"
          python3 scripts/split-map.py "$RUNNER_TEMP/out" "$low"
          python3 scripts/regional-basemap-desc.py "$RUNNER_TEMP/out" "$CODE"
          mkdir -p "$RUNNER_TEMP/desc" "$RUNNER_TEMP/files"
          mv "$RUNNER_TEMP/out/$low.basemap-desc.json" "$RUNNER_TEMP/desc/"
          mv "$RUNNER_TEMP/out/$low.search.sqlite" "$RUNNER_TEMP/files/"
          mv "$RUNNER_TEMP/out/$low.pmtiles"* "$RUNNER_TEMP/files/"
          ls -la "$RUNNER_TEMP/files"
      - uses: actions/upload-artifact@v4
        with:
          name: basemap-desc-${{ matrix.code }}
          path: ${{ runner.temp }}/desc/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: basemap-files-${{ matrix.code }}
          path: ${{ runner.temp }}/files/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  factory:
    needs: [precheck, basemap]
    if: needs.precheck.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      # Движок ПО DIGEST из regional-engine.lock, а не по изменяемому тегу.
      image: ${{ needs.precheck.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash    # bash -e -o pipefail: провал внутри конвейера больше не маскируется
    env:
      ENGINE_REF: ${{ needs.precheck.outputs.engine_ref }}
      ENGINE_SHA: ${{ needs.precheck.outputs.engine_sha }}
      TZ_URL: ${{ needs.precheck.outputs.timezones_url }}
      TIMEZONES_SHA256: ${{ needs.precheck.outputs.timezones_sha256 }}
      REBUILD: ${{ needs.precheck.outputs.rebuild }}
      CARRY: ${{ needs.precheck.outputs.carry }}
      COMPLETE: ${{ needs.precheck.outputs.complete }}
    steps:
      - uses: actions/checkout@v4

      - name: the engine is the one in regional-engine.lock
        run: |
          set -u
          df -h / | tail -1
          have_ref=$(cat /etc/wedrive-engine-ref); have_sha=$(cat /etc/wedrive-engine-sha)
          echo "engine in the image: $have_ref $have_sha"
          if [ "$have_ref" != "$ENGINE_REF" ] || [ "$have_sha" != "$ENGINE_SHA" ]; then
            echo "::error::the image is not engine $ENGINE_REF $ENGINE_SHA"; exit 1
          fi
          gid_test | tail -2
          # Frontiers (schema 2) need frontier_dump in the image. An image pinned before it existed
          # would otherwise fail an hour later, on the first country, instead of here.
          command -v frontier_dump >/dev/null \
            || { echo "::error::the pinned engine image has no frontier_dump: rebuild it (engine-image.yml) and pin its digest in regional-engine.lock"; exit 1; }

      - name: resource sampler
        run: |
          mkdir -p "$WORK"
          setsid nohup bash scripts/sample-resources.sh "$WORK/samples.csv" "$WORK" >/dev/null 2>&1 < /dev/null &
          echo $! > "$WORK/sampler.pid"

      - name: timezone database (pinned, sha-checked)
        run: |
          set -u
          curl -fsSL --retry 3 -o "$WORK/timezones.sqlite.part" "$TZ_URL"
          [ "$(sha256sum "$WORK/timezones.sqlite.part" | cut -d' ' -f1)" = "$TIMEZONES_SHA256" ] \
            || { echo "::error::timezones.sqlite does not match regional-engine.lock"; exit 1; }
          mv "$WORK/timezones.sqlite.part" "$WORK/timezones.sqlite"

      - name: build the changed countries
        run: |
          set -u
          export TIMEZONES_DB="$WORK/timezones.sqlite"
          for code in ${REBUILD//,/ }; do
            geo=$(python3 -c "import json,sys;print(json.load(open('regional.json'))['countries'][sys.argv[1]]['geofabrik'])" "$code")
            echo "::group::$code ($geo)"
            t=$(date +%s)
            bash scripts/regional-build.sh "$code" "$geo" "$WORK"
            echo "$code built in $(( $(date +%s)-t )) s" | tee -a "$WORK/timings.txt"
            echo "::endgroup::"
            df -h / | tail -1
          done

      # Страны, которые НЕ пересобирали, берутся из уже опубликованного — иначе «обновить одну
      # страну» превращается в «собрать все». Каждый байт сверяется с манифестом.
      - name: carry the unchanged countries
        run: |
          set -u
          for code in ${CARRY//,/ }; do
            python3 scripts/regional-carry.py manifest.json "$code" "$WORK"
          done

      - name: unpack the set
        run: |
          set -u
          for desc in "$WORK"/*.package.json; do
            code=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['code'])" "$desc")
            pkg=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['package'])" "$desc")
            dir="$WORK/installed/$code"
            mkdir -p "$dir/tiles"
            echo "   $code <- $pkg"
            # tar распознаёт .tar.gz перенесённых пакетов сам
            tar -xf "$WORK/$pkg" -C "$dir/tiles"
            n=$(find "$dir/tiles" -name '*.gph' | wc -l)
            echo "      tiles: $n"; [ "$n" -gt 0 ] || { echo "::error::$code has no tiles"; exit 1; }
          done

      # FRONTIERS. A rebuilt country made its own in regional-build.sh; a carried one brought its
      # published frontier. A carried country published BEFORE frontiers existed gets one here
      # (migration): from its unpacked tiles and, if Geofabrik still serves it, the exact extract
      # it was built from (md5 = provenance).
      - name: frontiers (migration backfill) and what changed since the previous release
        run: |
          set -u
          python3 scripts/regional-frontier.py backfill "$WORK" "$WORK/installed"
          python3 scripts/regional-frontier.py report "$WORK" manifest.json | tee "$WORK/frontier-report.txt"

      # NAVIGATION FEATURES: a carried country published before features existed gets them from
      # the dated extract its graph was built from (md5 = provenance); then every country's file is
      # gated against the previous production release (a type gone to zero fails the run).
      - name: navigation features (migration backfill) and gates
        run: |
          set -u
          python3 scripts/regional-features.py backfill "$WORK"
          python3 scripts/regional-features.py gates "$WORK" regional.json manifest.json | tee "$WORK/features-report.txt"

      # THE TABLE THE APP BUILDS: D1 over the set's frontiers. It is what the regression below runs
      # on, because it is what the car runs on. Ambiguity, or a border of regional.json with both
      # countries present and no portal, fails the run.
      - name: portals from frontiers (D1)
        run: python3 scripts/regional-frontier.py set regional.json "$WORK" "$WORK/set.d1" --report "$WORK/frontier-portals.json"

      # LEGACY pair tables, still published for apps that predate frontiers (schema 1). Nothing in
      # this run depends on them any more; they go in a separate step once the car runs schema 2.
      - name: legacy pair portal tables
        run: python3 scripts/regional-portals.py regional.json "$WORK/installed" "$WORK"

      - name: router configuration on the assembled set
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          work = os.environ["WORK"]
          cfg = json.load(open("regional.json"))
          installed = sorted(os.listdir(os.path.join(work, "installed")))
          with open("%s/router.json" % work, "w") as out:
              subprocess.run(["valhalla_build_config", "--mjolnir-tile-dir",
                              "%s/installed/%s/tiles" % (work, installed[0])], stdout=out, check=True)
          c = json.load(open("%s/router.json" % work))
          m = c["mjolnir"]
          m.pop("tile_extract", None)
          m["wedrive_regions"] = [{"id": cfg["countries"][code]["region_id"],
                                   "dir": "%s/installed/%s/tiles" % (work, code)} for code in installed]
          # The D1 table from frontiers — never the legacy pair tables: the regression proves what
          # the app does.
          m["wedrive_portals"] = os.path.join(work, "set.d1")
          json.dump(c, open("%s/router.json" % work, "w"), indent=1)
          rows = sum(1 for l in open(m["wedrive_portals"]) if l.strip())
          print("   regions: %s, portals from frontiers: %d rows" % (", ".join(installed), rows))
          PY

      - name: regression on the assembled set
        run: |
          # shellcheck disable=SC2046
          python3 scripts/regional-regress.py regional.json "$WORK/router.json" $(ls "$WORK/installed") \
            | tee "$WORK/regress.txt"

      # gzip -n и части — ПОСЛЕ регрессии: набор распакован из целых .tar, они больше не нужны.
      - name: package (gzip -n, parts over the asset limit)
        env:
          PART_BYTES: ${{ inputs.part_bytes }}
        run: python3 scripts/regional-package.py "$WORK" "${PART_BYTES:-}"

      - uses: actions/download-artifact@v4
        with:
          pattern: basemap-desc-*
          merge-multiple: true
          path: /data/regional/basemaps
      - name: manifest
        id: manifest
        run: |
          set -u
          TAG="regional-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 scripts/regional-manifest.py build regional.json "$WORK" "$BASE" \
            --previous manifest.json --tag "$TAG" --engine-lock regional-engine.lock \
            --pipeline-rev "${{ github.sha }}" --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --basemaps "$WORK/basemaps" > "$WORK/manifest.json"
          echo "--- manifest against the files:"
          if [ "$COMPLETE" = true ]; then
            python3 scripts/regional-manifest.py check "$WORK/manifest.json" "$WORK" --provenance --complete regional.json
          else
            python3 scripts/regional-manifest.py check "$WORK/manifest.json" "$WORK" --provenance
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p "$WORK/dist"
          cp "$WORK/manifest.json" "$WORK/dist/"
          python3 scripts/regional-manifest.py assets "$WORK/manifest.json" | while read -r f; do
            mv "$WORK/$f" "$WORK/dist/"
          done
          find "$WORK/dist" -maxdepth 1 -type f -printf '   %s  %f\n'
          cat "$WORK/manifest.json"

      - name: resources
        if: always()
        run: |
          kill "$(cat "$WORK/sampler.pid" 2>/dev/null)" 2>/dev/null || true
          python3 scripts/peak-from-samples.py "$WORK/samples.csv" --label factory | tee "$WORK/resources.txt" || true
          cat "$WORK/timings.txt" 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: regional-release-${{ github.run_number }}
          path: /data/regional/dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-logs-${{ github.run_number }}
          retention-days: 30
          path: |
            /data/regional/regress.txt
            /data/regional/frontier-report.txt
            /data/regional/frontier-portals.json
            /data/regional/features-report.txt
            /data/regional/resources.txt
            /data/regional/samples.csv
            /data/regional/timings.txt
            /data/regional/manifest.json
            /data/regional/*.package.json
            /data/regional/work_*/tiles.log

  # ── ПУБЛИКАЦИЯ: на runner'е, а не в контейнере (в образе движка нет gh) ──────────────────────────
  publish:
    needs: [precheck, factory]
    if: needs.precheck.outputs.mode == 'verify' || needs.precheck.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: regional-release-${{ github.run_number }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: basemap-files-*
          merge-multiple: true
          path: dist
      - name: draft -> upload -> verify -> (delete | publish -> urls -> manifest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.precheck.outputs.mode }}
        run: bash scripts/regional-publish.sh dist "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" "$MODE"

  report:
    needs: [precheck, factory, publish]
    if: failure() && (github.event_name == 'schedule' || needs.precheck.outputs.mode == 'publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          {
            echo "The regional factory run failed and **nothing new was published**."
            echo "manifest.json still names the previous release; every car keeps it."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            echo "$RESULTS" | python3 -c 'import json,sys;[print("%-9s %s"%(k,v["result"])) for k,v in json.load(sys.stdin).items()]'
            echo '```'
          } > "$body"
          gh issue create --repo "$REPO" --title "Regional factory failed ($(date -u +%F))" --body-file "$body"
