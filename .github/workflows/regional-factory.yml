name: regional factory

# Региональная фабрика: одна страна — один пакет, границы — отдельные таблицы порталов.
#
# Идёт РЯДОМ со старым конвейером, а не вместо него. build-maps.yml продолжает выпускать
# когерентные многострановые пакеты в релиз `maps` и index.json — то, чем машина пользуется
# сегодня. Ничего не переключается, пока региональная схема не проверена целиком.
#
# ЧТО ДЕЛАЕТ ОДИН ПРОГОН:
#   1. собирает названные страны с нуля (экстракт Geofabrik -> admin -> тайлы -> .tar -> sha256)
#   2. берёт остальные страны набора из ТЕКУЩЕГО манифеста, скачивая опубликованные пакеты
#   3. перегенерирует таблицы порталов всех границ, которых касаются пересобранные страны
#   4. прогоняет регрессию на СОБРАННОМ НАБОРЕ, а не на исходниках
#   5. публикует неизменяемый релиз
#   6. и только после успеха переключает current-манифест
#
# Порядок не случаен. Манифест — это обещание устройству; переключать его до регрессии значит
# обещать то, что не проверено.

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Какие страны пересобрать (через запятую, например RO). Пусто = все."
        required: false
        default: ""
      publish:
        description: "Публиковать релиз и переключать манифест"
        type: boolean
        required: false
        default: true
      part_bytes:
        description: "Порог разрезания пакета, байт. Пусто = предел актива GitHub (1.9 ГиБ). Меньшее значение — чтобы проверить механику на небольшой стране."
        required: false
        default: ""

permissions:
  contents: write
  packages: read

env:
  RELEASE_TAG_CURRENT: regional
  WORK: /data/regional

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      # Патченый движок: одна строка multi-region живёт в Mjolnir, и тайлы, собранные стоковым
      # сборщиком, для этой схемы непригодны.
      image: ghcr.io/slavonip/wedrive-engine:multi-region-runtime-v2
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: место и движок
        run: |
          df -h / | tail -1
          echo "движок в образе: $(cat /etc/wedrive-engine-ref) $(cut -c1-12 /etc/wedrive-engine-sha)"
          gid_test | tail -2

      - name: что пересобираем
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("regional.json"))
          asked = [c.strip().upper() for c in os.environ.get("REBUILD", "").split(",") if c.strip()]
          allc = list(cfg["countries"])
          rebuild = asked or allc
          bad = [c for c in rebuild if c not in cfg["countries"]]
          if bad:
              raise SystemExit("нет таких стран в regional.json: %s" % bad)
          print("rebuild=%s" % ",".join(rebuild))
          print("all=%s" % ",".join(allc))
          PY
        env:
          REBUILD: ${{ github.event.inputs.rebuild }}

      - name: собрать страны
        run: |
          set -e
          mkdir -p "$WORK"
          for code in $(echo "${{ steps.plan.outputs.rebuild }}" | tr ',' ' '); do
            geo=$(python3 -c "import json;print(json.load(open('regional.json'))['countries']['$code']['geofabrik'])")
            echo "::group::$code ($geo)"
            bash scripts/regional-build.sh "$code" "$geo" "$WORK"
            echo "::endgroup::"
            df -h / | tail -1
          done

      # Страны, которые НЕ пересобирали, берутся из уже опубликованного — иначе «обновить одну
      # страну» превращается в «собрать все», и вся схема теряет смысл.
      - name: добрать остальные страны из текущего манифеста
        run: |
          set -e
          cur=manifest.json
          if [ ! -f "$cur" ]; then
            echo "текущего манифеста ещё нет — первый прогон собирает всё сам"
            exit 0
          fi
          for code in $(echo "${{ steps.plan.outputs.all }}" | tr ',' ' '); do
            case ",${{ steps.plan.outputs.rebuild }}," in *",$code,"*) continue;; esac
            python3 - "$cur" "$code" "$WORK" <<'PY'
          import json, os, subprocess, sys
          man, code, work = json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3]
          r = man.get("regions", {}).get(code)
          if not r:
              print("   %s нет в манифесте — пропуск" % code); raise SystemExit(0)
          dst = os.path.join(work, r["package"])
          if not os.path.isfile(dst):
              # ПАКЕТ МОЖЕТ БЫТЬ РАЗРЕЗАН, и тогда по r["url"] актива нет вовсе: резчик удаляет
              # целый .tar, а в релиз уходят только части. Скачать один URL значило бы получить
              # 404 через час после начала сборки — ровно там, где потеря дороже всего.
              base = r["url"].rsplit("/", 1)[0]
              parts = r.get("parts") or []
              if parts:
                  print("   качаю %s частями: %d" % (r["package"], len(parts)))
                  with open(dst, "wb") as out:
                      for p in parts:
                          tmp = os.path.join(work, p["name"])
                          subprocess.run(["curl", "-fsSL", "-o", tmp, "%s/%s" % (base, p["name"])],
                                         check=True)
                          with open(tmp, "rb") as f:
                              while True:
                                  chunk = f.read(1 << 20)
                                  if not chunk:
                                      break
                                  out.write(chunk)
                          os.remove(tmp)
              else:
                  print("   качаю %s" % r["url"])
                  subprocess.run(["curl", "-fsSL", "-o", dst, r["url"]], check=True)
          json.dump({"code": code, "geofabrik": "", "graph_version": r["graph_version"],
                     "tiles": r.get("tiles", 0), "package": r["package"],
                     "bytes": r["bytes"], "sha256": r["sha256"],
                     "engine": r.get("engine", "unknown"), "engine_sha": ""},
                    open(os.path.join(work, "%s.package.json" % code.lower()), "w"))
          print("   %s взят из манифеста: %s" % (code, r["package"]))
          PY
          done

      - name: распаковать набор
        run: |
          set -e
          for desc in "$WORK"/*.package.json; do
            code=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['code'])" "$desc")
            pkg=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['package'])" "$desc")
            dir="$WORK/installed/$code"
            mkdir -p "$dir/tiles"
            echo "   $code <- $pkg"
            # Пакет — это tile_extract; читателю нужен либо он, либо каталог. Порталам нужен
            # каталог, поэтому распаковываем.
            tar -xf "$WORK/$pkg" -C "$dir/tiles"
            find "$dir/tiles" -name '*.gph' | wc -l | sed 's/^/      тайлов: /'
          done

      # ВСЕ таблицы, а не только затронутые пересборкой.
      #
      # Фильтр по пересобранным странам здесь был дефектом, а не оптимизацией: таблицы остальных
      # границ в рабочем каталоге не появляются ниоткуда, и набор уезжал в публикацию без них.
      # Таблица стоит секунды против часов сборки, а её отсутствие стоит границы.
      #
      # Пересчитать таблицу уже существующей пары не вредно и даже правильнее: тайлы непересобранных
      # стран взяты из опубликованных пакетов, то есть те же байты, и таблица выходит та же.
      - name: таблицы порталов
        run: |
          python3 scripts/regional-portals.py regional.json "$WORK/installed" "$WORK"

      - name: конфигурация маршрутизатора на собранном наборе
        run: |
          python3 - <<'PY'
          import json, os
          work = os.environ["WORK"]
          cfg = json.load(open("regional.json"))
          installed = sorted(os.listdir(os.path.join(work, "installed")))
          os.system("valhalla_build_config --mjolnir-tile-dir %s/installed/%s/tiles > %s/router.json"
                    % (work, installed[0], work))
          c = json.load(open("%s/router.json" % work))
          m = c["mjolnir"]
          m.pop("tile_extract", None)
          m["wedrive_regions"] = [{"id": cfg["countries"][code]["region_id"],
                                   "dir": "%s/installed/%s/tiles" % (work, code)}
                                  for code in installed]
          tables = [os.path.join(work, f) for f in sorted(os.listdir(work)) if f.endswith(".portals")]
          allp = os.path.join(work, "all.portals")
          with open(allp, "w") as out:
              for t in tables:
                  out.write(open(t, encoding="utf-8").read())
          m["wedrive_portals"] = allp
          json.dump(c, open("%s/router.json" % work, "w"), indent=1)
          print("   регионов: %s" % ", ".join(installed))
          print("   таблиц: %d" % len(tables))
          PY

      - name: регрессия на собранном наборе
        run: |
          installed=$(ls "$WORK/installed")
          python3 scripts/regional-regress.py regional.json "$WORK/router.json" $installed

      # РЕЖЕМ ТО, ЧТО НЕ ВЛЕЗАЕТ В АКТИВ РЕЛИЗА — И ТОЛЬКО ЗДЕСЬ, ПОСЛЕ РЕГРЕССИИ.
      #
      # Место шага не вкусовое. Резчик УДАЛЯЕТ целый .tar, а он нужен всему, что идёт
      # раньше: распаковка набора читает именно его, и без него таблицы порталов строить
      # не из чего. Прогон 35534572218 упал ровно так — `tar: md-2026-09-19.tar: Cannot
      # open`, — потому что шаг стоял сразу после сборки стран.
      #
      # Здесь же целый архив больше никому не нужен: набор распакован, порталы построены,
      # регрессия пройдена. Дальше идут манифест, артефакт и релиз, и всем троим нужны
      # именно части.
      #
      # GitHub держит актив чуть меньше 2 ГиБ, а граф Германии около 5.4 ГБ (экстракт 4.51 ГБ,
      # отношение графа к PBF ~1.2 на всех собранных странах). Большая страна публикуется
      # частями или не публикуется вовсе, и узнать об этом на шаге выгрузки — значит потерять
      # всю сборку, которая к тому моменту уже сделана.
      #
      # Целый .tar после резки удаляется самим split-assets.py: выгружать и его, и части значило
      # бы удвоить релиз ради файла, который всё равно не принимается.
      #
      # Порог можно занизить входом part_bytes — так механика проверяется на стране, которую не
      # нужно собирать час.
      - name: разрезать пакеты сверх предела актива
        env:
          PART_BYTES: ${{ github.event.inputs.part_bytes }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location("split_assets", "scripts/split-assets.py")
          sa = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sa)
          limit = int(os.environ.get("PART_BYTES") or 0) or sa.PART_BYTES
          sa.PART_BYTES = limit
          work = pathlib.Path(os.environ["WORK"])
          print("   порог: %d байт" % limit)
          for desc in sorted(work.glob("*.package.json")):
              d = json.loads(desc.read_text(encoding="utf-8"))
              tar = work / d["package"]
              if not tar.is_file():
                  continue
              info = sa.split(tar)
              if not info["parts"]:
                  print("   %-3s %s: %d байт, одним активом" % (d["code"], d["package"], info["bytes"]))
                  continue
              d["bytes"], d["sha256"], d["parts"] = info["bytes"], info["sha256"], info["parts"]
              desc.write_text(json.dumps(d, indent=2), encoding="utf-8")
              print("   %-3s %s: %d байт -> %d частей"
                    % (d["code"], d["package"], info["bytes"], len(info["parts"])))
          PY

      - name: манифест
        id: manifest
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          TAG="regional-$DATE-${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 scripts/regional-manifest.py build regional.json "$WORK" "$BASE" > "$WORK/manifest.json"
          echo "--- сверка манифеста с файлами:"
          python3 scripts/regional-manifest.py check "$WORK/manifest.json" "$WORK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat "$WORK/manifest.json"

      - name: план обновления, для журнала
        run: |
          for code in $(echo "${{ steps.plan.outputs.all }}" | tr ',' ' '); do
            echo "::group::если обновится $code"
            python3 scripts/regional-manifest.py plan "$WORK/manifest.json" "$code" || true
            echo "::endgroup::"
          done

      # Собранное отдаётся наружу артефактом, потому что публикует ДРУГОЕ задание. В контейнере
      # движка нет `gh`, и это не мелочь: заметив её только на шаге релиза, мы бы потеряли час
      # сборки. Этот репозиторий уже записывал ровно это наблюдение про свой прежний конвейер.
      - name: отдать собранное
        uses: actions/upload-artifact@v4
        with:
          name: regional-${{ github.run_number }}
          path: |
            /data/regional/*.tar
            /data/regional/*.tar.part*
            /data/regional/*.portals
            /data/regional/manifest.json
            !/data/regional/all.portals
          retention-days: 3
          if-no-files-found: error

  # ── ПУБЛИКАЦИЯ: на runner'е, а не в контейнере ──────────────────────────────────────────────
  publish:
    needs: factory
    if: ${{ github.event.inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: regional-${{ github.run_number }}
          path: dist

      - name: что publish собирается выложить
        run: ls -la dist | sed 's/^/   /'

      # Тег берётся ИЗ МАНИФЕСТА, а не вычисляется заново: манифест уже содержит ссылки на этот
      # тег внутри себя, и разъехавшись, они указали бы в пустоту.
      - name: тег из манифеста
        id: tag
        run: |
          TAG=$(python3 -c "import json,sys;m=json.load(open('dist/manifest.json'));import re;u=next(iter(m['regions'].values()))['url'];print(u.split('/download/')[1].split('/')[0])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "тег: $TAG"

      - name: неизменяемый релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          # Неизменяемый: свой тег на прогон, ничего не перезаписывается. Откат — это
          # переключение current-манифеста на прошлый тег, а не пересборка.
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Региональные пакеты $TAG" \
            --notes "Региональные пакеты и таблицы порталов. Манифест внутри релиза." \
          || echo "релиз уже существует"
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done

      # Манифест переключается ПОСЛЕДНИМ. Он обещает устройству, что набор проверен; сделать это
      # раньше регрессии и раньше выкладки значит пообещать то, чего ещё нет.
      - name: переключить current
        run: |
          set -e
          cp dist/manifest.json manifest.json
          git config user.name "wedrive-factory"
          git config user.email "factory@users.noreply.github.com"
          git add manifest.json
          git commit -m "Региональный манифест -> ${{ steps.tag.outputs.tag }}" || exit 0
          # ПОДБИРАЕМ ЧУЖИЕ КОММИТЫ ПЕРЕД ПУШЕМ, и это не перестраховка.
          #
          # Сборка идёт десятки минут, а main всё это время живёт: правка скрипта, добавленная
          # страна, что угодно. Прогон 2026-09-20 упал ровно так — собрал четыре страны, прошёл
          # регрессию, выложил релиз и отказался переключить манифест, потому что пуш отклонён.
          # Артефакты опубликованы, а указатель на них нет, и машина видит СТАРЫЙ набор, ничего
          # не сообщая: отказ выглядит как «обновления нет». Из всех мест, где можно потерять
          # час работы, это худшее — последняя строка после всей работы.
          #
          # rebase, а не merge: правится один файл, и история манифеста должна остаться прямой.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "current манифест указывает на ${{ steps.tag.outputs.tag }}"
              exit 0
            fi
            echo "попытка $attempt не прошла, пробую ещё"
            sleep 5
          done
          echo "манифест не переключён: main меняется быстрее, чем мы успеваем" >&2
          exit 1
