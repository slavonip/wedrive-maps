name: europe build

# ONE COHERENT EUROPE GRAPH, on a machine that exists for the length of one build.
#
# Why it cannot stay on GitHub's runners is measured, not assumed: two independently built
# masters produce incompatible tiles at their seam — 31 shared paths, zero byte-identical — and
# a route across it came back 937 km at a plausible 78 km/h with a 294.89 km JUMP in its own
# geometry. So Europe must be ONE build; one build needs ~172 GB of scratch; and the pipeline
# cannot be split to fit, because its peak is the hierarchy stage, which is what makes the graph
# one graph and therefore cannot be divided.
#
# THREE JOBS, AND THE THIRD IS THE POINT:
#
#   bootstrap   free runner. Mints a JIT credential, creates the machine, hands back its name.
#   build       the ephemeral machine itself. Takes exactly one job and disappears.
#   cleanup     free runner, `if: always()`. Deletes the machine whatever happened to the build.
#
# Cleanup CANNOT run on the builder, because the cases that matter — OOM, kernel panic, a runner
# that vanishes — are exactly the cases where the builder cannot act. And even cleanup can fail
# to run at all (a cancelled workflow, a GitHub incident), which is why every machine is born
# with an `expires` label and `hetzner-watchdog.yml` sweeps hourly from somewhere else entirely.
# Three mechanisms, failing independently; the machine also powers itself off on uptime if it
# never gets a job.
#
# DELIBERATELY `workflow_dispatch` ONLY. The monthly schedule goes in after one green end-to-end
# run has shown what CAX41 actually does — wall time, peak anon, peak disk, cost. Turning on a
# recurring paid job before that would be paying to find out.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight only — check everything, create nothing, bill nothing"
        type: boolean
        default: true
      ttl_hours:
        description: "Hours before the watchdog may delete the builder"
        default: "6"

concurrency:
  group: europe-build
  cancel-in-progress: false

env:
  BUILDER_NAME: wedrive-europe-builder
  # Pinned deliberately, and GATED by the preflight against GitHub's release list. 2.328.0
  # was refused as deprecated on 2026-09-18 after a machine had already been created — the pin
  # had rotted, and "the tarball still downloads" was the wrong thing to have checked.
  RUNNER_VERSION: "2.337.0"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.create.outputs.created }}
    env:
      # `secrets` is NOT available in a step's `if` — checked in GitHub's context-availability
      # table, not assumed — but it IS available in a job's `env`. So the presence of the App is
      # turned into an env var here and tested there. Written as `if: secrets.X != ''` the
      # condition would simply never be true, and the workflow would fall back to a PAT forever
      # while looking like it preferred the App.
      HAS_APP: ${{ secrets.RUNNER_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # ── A GITHUB APP, NOT A PERSON'S TOKEN ─────────────────────────────────────────────────
      # `create-github-app-token` exchanges the App's private key for an INSTALLATION token that
      # lives one hour, is scoped to this repository, and — because of `permission-administration`
      # — carries only the one permission minting a runner config needs, even if the App itself
      # was granted more. It belongs to no person, so it survives someone leaving and cannot be
      # used anywhere else.
      #
      # This is the control plane's only long-lived secret, and it is a key rather than a token:
      # a leaked App key can be rotated in one place without touching anyone's account.
      - name: a short-lived credential from the App
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      # EVERY LINK, CHECKED WHILE CHECKING IS STILL FREE. The next step bills by the hour.
      - name: preflight
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          # The App if it is configured, a PAT only as a fallback — and the preflight SAYS which
          # answered, because a silent downgrade from an App to a person's token is exactly the
          # kind of thing that goes unnoticed for a year.
          RUNNER_TOKEN: ${{ steps.app.outputs.token || secrets.RUNNER_ADMIN_TOKEN }}
          RUNNER_TOKEN_SOURCE: ${{ steps.app.outputs.token && 'github-app' || 'personal-token' }}
          RUNNER_VERSION: ${{ env.RUNNER_VERSION }}
        run: python3 scripts/preflight-builder.py --ttl-hours "${{ inputs.ttl_hours }}"

      - name: stop here if this is a dry run
        if: inputs.dry_run
        run: |
          echo "### preflight only — nothing was created" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run with dry_run unchecked to build Europe." >> "$GITHUB_STEP_SUMMARY"

      # ── FROM HERE ON, MONEY ──────────────────────────────────────────────────────────────
      - name: mint a just-in-time runner credential
        if: '!inputs.dry_run'
        id: jit
        env:
          RUNNER_ADMIN_TOKEN: ${{ steps.app.outputs.token || secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          # Bound to ONE job on ONE runner. Even if the machine's user_data leaked wholesale,
          # what leaks is a credential the build has already consumed.
          config=$(curl -fsS -X POST \
            -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/generate-jitconfig" \
            -d "{\"name\":\"$BUILDER_NAME-${{ github.run_id }}\",\"runner_group_id\":1,
                 \"labels\":[\"self-hosted\",\"europe-builder\"],\"work_folder\":\"_work\"}" \
            | jq -r .encoded_jit_config)
          [ -n "$config" ] && [ "$config" != "null" ] || { echo "::error::no JIT config"; exit 1; }
          echo "::add-mask::$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"

      # AN EPHEMERAL KEY, GENERATED HERE AND NEVER STORED. It is not created as a Hetzner SSH
      # key resource, so no long-lived credential exists anywhere: the public half rides in the
      # cloud-init, the private half lives in this job's filesystem for a few minutes, and both
      # die with the machine. Its only purpose is reading logs off a builder that failed.
      - name: an ephemeral key, for reading logs off a failure
        if: '!inputs.dry_run'
        id: key
        run: |
          ssh-keygen -t ed25519 -N "" -C "wedrive-${{ github.run_id }}" -f /tmp/builder_key -q
          echo "pub=$(cat /tmp/builder_key.pub)" >> "$GITHUB_OUTPUT"

      - name: create the builder
        if: '!inputs.dry_run'
        id: create
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          # __ARCH__ is filled by `create` itself, because only it knows which rung of the ladder
          # won — cax41 is ARM, everything below it is x86 — and a machine that fetches the wrong
          # runner tarball boots, does nothing, and bills until the watchdog sweeps it. `create`
          # refuses outright if any placeholder survives, rather than creating such a machine.
          python3 scripts/hetzner.py create \
            --name "$BUILDER_NAME" \
            --ttl-hours "${{ inputs.ttl_hours }}" \
            --user-data infra/cloud-init.yml \
            --sub "RUNNER_VERSION=$RUNNER_VERSION" \
            --bootstrap infra/bootstrap-runner.sh             --sub "JIT_CONFIG=${{ steps.jit.outputs.config }}"             --sub "SSH_PUBKEY=${{ steps.key.outputs.pub }}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # ── WAIT FOR THE MACHINE TO ACTUALLY ARRIVE, AND GIVE UP IF IT DOES NOT ─────────────────
      # The first paid attempt created a server whose runner never connected, and nothing noticed
      # for 28 minutes: the build job simply sat queued while the machine billed. `create`
      # returning success says a machine EXISTS, which is a different claim from a runner being
      # online, and the gap between them is paid for by the minute.
      #
      # Six minutes is generous — boot plus apt plus a 200 MB runner download measured well under
      # that — and failing here hands control to `cleanup`, which deletes the machine. A bounded
      # loss instead of an open-ended one.
      - name: wait for the runner to come online
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          want="$BUILDER_NAME-${{ github.run_id }}"
          deadline=$(( $(date +%s) + 360 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(gh api "repos/${{ github.repository }}/actions/runners"                        --jq ".runners[] | select(.name==\"$want\") | .status" 2>/dev/null || true)
            if [ "$status" = "online" ]; then
              echo "runner online after $(( 360 - (deadline - $(date +%s)) ))s"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the runner never came online in 6 minutes."
          exit 1

      # ── ASK THE MACHINE BEFORE DESTROYING IT ───────────────────────────────────────────────
      # Two builders have now been created, billed and deleted without anyone learning why their
      # runner never connected. The second had a journal explaining it, on a host removed ten
      # seconds later. The logs existed and were unreachable — the same blindness in better
      # clothes, and it is what this step exists to end.
      #
      # It runs BEFORE cleanup, because cleanup is a separate job and jobs do not interleave. It
      # never fails the run: a diagnosis that could mask the failure it is diagnosing would be
      # worse than none.
      - name: what the machine has to say for itself
        if: failure() && steps.create.outputs.created == 'true'
        continue-on-error: true
        run: |
          ip="${{ steps.create.outputs.hetzner_server_ip }}"
          echo "reading logs from $ip before it is deleted"
          mkdir -p ~/.ssh && ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts 2>/dev/null || true
          # sshd may still be starting: a machine too broken to run a runner is often not too
          # broken to answer, but it may need a minute.
          for attempt in $(seq 1 10); do
            if ssh -i /tmp/builder_key -o StrictHostKeyChecking=no                    -o ConnectTimeout=10 -o BatchMode=yes "diagnostic@$ip" true 2>/dev/null; then
              break
            fi
            echo "   ssh not answering yet (attempt $attempt)"; sleep 15
          done
          ssh -i /tmp/builder_key -o StrictHostKeyChecking=no -o BatchMode=yes               "diagnostic@$ip" 'bash -s' < infra/diagnose.sh 2>&1 | tee /tmp/diag.txt ||             echo "SSH never answered — the machine did not reach a state where it could"
          {
            echo "### the builder could not be reached by GitHub — here is what it said"
            echo '```'
            tail -300 /tmp/diag.txt 2>/dev/null || echo "no diagnostics were obtained"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: bootstrap
    if: needs.bootstrap.outputs.created == 'true'
    runs-on: [self-hosted, europe-builder]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: what this machine actually is
        run: |
          echo "arch:   $(uname -m)"
          echo "cores:  $(nproc)"
          awk '/MemTotal/{printf "memory: %.1f GB\n", $2/1048576}' /proc/meminfo
          df -h / | tail -1

  cleanup:
    needs: [bootstrap, build]
    env:
      HAS_APP: ${{ secrets.RUNNER_APP_ID != '' }}
    # ALWAYS. Not on success, not on failure — always. A cancelled run, a failed build and a
    # builder that stopped answering all reach here, and all of them leave a machine billing if
    # this does not fire.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: a credential for tidying the runner list
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: delete the builder
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          python3 scripts/hetzner.py delete --name "$BUILDER_NAME"
          echo "--- what is left ---"
          python3 scripts/hetzner.py list

      # THE OTHER HALF OF THE LEAK. Minting a JIT config registers a runner immediately, and an
      # ephemeral runner only removes itself after it has RUN a job. If the machine never came up
      # — no capacity, a cloud-init failure, a build cancelled before it started — the
      # registration survives as an offline phantom, and the next run collides with it.
      #
      # That is exactly how the first paid attempt failed: HTTP 409 on a name a previous probe
      # had taken.
      - name: deregister a runner that never ran
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/runners"                  --jq ".runners[] | select(.name==\"$BUILDER_NAME-${{ github.run_id }}\") | .id")
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/runners/$id"
            echo "deregistered the runner for this run ($id) — it never consumed its job"
          else
            echo "no runner left registered for this run"
          fi
