name: build region

# THE NEW PIPELINE, RUNNING BESIDE THE OLD ONE ON PURPOSE (owner, 2026-09-17: "чтобы не ломать
# что есть, можем сделать в копии"). `build-maps.yml` keeps producing whole packages into the
# `maps` release and `index.json`, which is what the car uses today. This one produces per-country
# tile sets into a separate `tiles` release and `index-tiles.json`, and nothing switches over
# until the cut path has proved itself in the vehicle.
#
# The difference is the ORDER. A package is built from its own PBFs and shipped whole. A region is
# built ONCE over every country in it and cut afterwards, so the frontier has edges and a car can
# hold two countries as separate downloads and still drive between them.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Super-region id from regions.yml (e.g. eu-core)"
        required: true
        default: "eu-core"
      timezone:
        description: "Timezone dataset: 'vendored' (the promoted one), or a candidate tag like 2026d"
        required: false
        default: "vendored"
  schedule:
    # A week after the package build, so the two never contend for the same runner minutes while
    # both exist. Moves to the 1st when the packages are retired.
    - cron: "17 2 8 * *"

  # ── CALLABLE, SO EUROPE DOES NOT GET A SECOND PIPELINE ────────────────────────────────────
  # `europe-build.yml` creates an ephemeral Hetzner machine and then calls THIS workflow to do
  # the work. The alternative was copying the build steps into that workflow, which would have
  # given the largest and least-tested build its own divergent copy of the logic — so a fix
  # found on eu-core would silently not apply to Europe, and the two would drift in exactly the
  # direction nobody checks.
  #
  # What varies between them is one thing: WHICH MACHINE the build job runs on. Everything else
  # — coverage, the timezone gate, build-master.sh, the cuts, the probes, publication — is the
  # same code reached the same way.
  workflow_call:
    inputs:
      region:
        type: string
        required: true
      timezone:
        type: string
        required: false
        default: "vendored"
      runner:
        description: "JSON array of runner labels for the BUILD job only. Plan and publish stay free."
        type: string
        required: false
        default: '["ubuntu-latest"]'

concurrency:
  group: build-region
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.read.outputs.members }}
      countries: ${{ steps.read.outputs.countries }}
      # Empty for a merged region, the Geofabrik stem for one built from a single extract.
      source: ${{ steps.read.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      # Coverage first, as in the package pipeline: a country with no probes must fail in a
      # second rather than after an hours-long build over five countries.
      - name: the region is covered by probes
        run: |
          pip install --quiet pyyaml
          python3 scripts/region-plan.py "${{ inputs.region || 'eu-core' }}" --check

      - id: read
        run: |
          pip install --quiet pyyaml
          python3 scripts/region-plan.py "${{ inputs.region || 'eu-core' }}" \
            >> "$GITHUB_OUTPUT"

      - name: derive each country's probe plan
        run: |
          python3 scripts/region-plan.py "${{ inputs.region || 'eu-core' }}" --plans plan
      - uses: actions/upload-artifact@v4
        with:
          name: region-plan
          path: plan/
          retention-days: 2

  build:
    needs: plan
    # THE ONLY THING EUROPE CHANGES. `ubuntu-latest` for eu-core and every scheduled run;
    # the ephemeral Hetzner builder when the caller passes its labels. The `||` fallback is
    # load-bearing: on `workflow_dispatch` this input does not exist, and `fromJSON('')` is a
    # hard error rather than a default.
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/valhalla/valhalla:3.6.3
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # A five-country build is the first thing here big enough for disk to matter. Measured
      # 2026-09-17: a runner has 145 GB with 86 GB free, an order of magnitude more than the
      # 14 GB this repo used to assume — but the 6-hour job limit is real and is why all of
      # Europe (32.6 GB of PBF) is the destination rather than the starting point.
      - name: reclaim disk
        run: |
          rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: region-plan
          path: plan

      # WHICH TIMEZONE DATASET, and it is never "the newest one available". The promoted file is
      # the default and the only thing a scheduled run can reach; a candidate is named explicitly
      # by a human who wants this region built against it before it is promoted. That is the
      # whole point of the sequence: candidate -> compatibility test -> master build -> probes ->
      # promote, with a real region's routes proving the dataset before it becomes everyone's.
      - name: timezone database
        run: |
          mkdir -p /data/vendor
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/maps-vendor"
          asset=timezones.sqlite
          version=timezones.version
          if [ "${{ inputs.timezone || 'vendored' }}" != "vendored" ]; then
            asset="timezones-${{ inputs.timezone }}.sqlite"
            version="timezones-${{ inputs.timezone }}.version"
            echo "::notice::building against CANDIDATE timezone dataset ${{ inputs.timezone }}"
          fi
          if curl -fsSL -o /data/vendor/timezones.sqlite "$base/$asset" &&
             curl -fsSL -o /data/vendor/timezones.version "$base/$version"; then
            echo "timezones $(cat /data/vendor/timezones.version)"
          else
            rm -f /data/vendor/timezones.sqlite
            echo "::warning::no timezone database ($asset); this region cannot be promoted"
          fi

      # ── THE GATE, AND IT IS DELIBERATELY ITS OWN STEP ───────────────────────────────────────
      # A deprecated zone identifier does not fail the build where it is fed in. It fails half an
      # hour later, inside tile building, and it wears two different faces — one message about
      # time, one `vector::_M_range_check` that mentions nothing of the sort. That cost a week and
      # eight bisecting runs. Asked here the same question costs a second, and the failure email
      # names THIS step rather than "build and cut".
      #
      # `build-master.sh` asks it again, because a local build must not be able to skip it. This
      # copy exists purely so the answer arrives before the expensive part starts.
      - name: timezone gate
        run: |
          if [ ! -f /data/vendor/timezones.sqlite ]; then
            echo "no timezone database to check; the build will run without one and cannot be promoted"
            exit 0
          fi
          claimed="$(cat /data/vendor/timezones.version 2>/dev/null || echo unknown)"
          python3 scripts/check-timezones.py /data/vendor/timezones.sqlite --expect-dataset "$claimed"

      # ONE PBF, merged before the build. Both the shape the design wants and a candidate fix
      # for the four-country abort: a master build hands Valhalla a single file, so the
      # multi-input path that fails is never taken (docs/map-factory.md §12).
      - name: build and cut
        env:
          # The freshness gate compares each extract against what the LAST PROMOTED release
          # recorded, and that lives in the checked-out index rather than under /data. Without
          # this it would silently have nothing to compare against and every build would look
          # like a country's first.
          OSM_INDEX: ${{ github.workspace }}/index-tiles.json
          # ONE EXTRACT, OR SEVERAL MERGED. Empty for eu-core, which keeps the merge path
          # exactly as it was; `europe` for a region whose Geofabrik extract already covers
          # every country in it, where no country PBF is downloaded at all.
          MASTER_SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          mkdir -p /data
          cp -r scripts /data/scripts
          bash /data/scripts/build-master.sh "${{ inputs.region || 'eu-core' }}" \
            ${{ needs.plan.outputs.members }}

      # THE GATE, over the ASSEMBLED cuts rather than the whole build — because assembled is
      # what a car will actually read, and the difference between the two is the entire question
      # this pipeline exists to answer.
      - name: probe the assembled cuts
        run: |
          set +e
          python3 scripts/probe-cuts.py "/data/cuts_${{ inputs.region || 'eu-core' }}" \
            plan 2>&1 | tee /data/cuts-output.txt
          exit "${PIPESTATUS[0]}"

      # ── THE DISCRIMINATOR, and it is free exactly here ──────────────────────────────────────
      # The master tile directory and the country cuts both exist in THIS runner and nowhere else
      # after it ends, so the one comparison that separates "the cut dropped it" from "it was
      # never written" costs nothing while they are still on disk — and a rebuild to ask later
      # costs half an hour.
      #
      # It runs on failure only, and it never gates: it reads the timezone out of the graph nodes
      # themselves rather than inferring it from a route, at several points per country plus
      # controls in countries that pass. A diagnostic able to fail a build invites being made to
      # pass, so this one always exits 0.
      - name: what the graph actually holds
        if: failure()
        run: |
          region="${{ inputs.region || 'eu-core' }}"
          python3 scripts/diagnose-timezone.py "/data/tiles_$region" --label "MASTER (before the cut)"
          for dir in /data/cuts_$region/*/; do
            code="$(basename "$dir")"
            python3 scripts/diagnose-timezone.py "$dir" --label "CUT $code" --only "$code"
          done

      - name: report the probes
        if: always()
        run: |
          {
            echo "### region: ${{ inputs.region || 'eu-core' }}"
            echo
            echo '```'
            cat /data/cuts-output.txt 2>/dev/null || echo "the probes did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── THE MEASUREMENT MUST OUTLIVE THE MACHINE ────────────────────────────────────────
      # `summarise-build.py` writes its report at the END of a successful build — which is
      # exactly the build whose limits are already known. The interesting run is the one that
      # dies: an OOM leaves no report, no archive and no manifest, and the CSVs that DO survive
      # (the sampler runs under an EXIT trap) were not in the upload list. They would have died
      # with the server, which is this project's oldest mistake wearing its third disguise.
      #
      # `continue-on-error` on both steps: a telemetry upload that fails must never become the
      # reason the job is red, or it would mask the build failure it exists to explain.
      - name: what the build wanted, even if it died wanting it
        if: always()
        continue-on-error: true
        run: |
          region="${{ inputs.region || 'eu-core' }}"
          {
            echo "### telemetry"
            echo '```'
            if [ -f /data/stage.current ]; then
              IFS=, read -r stage started < /data/stage.current
              echo "last stage entered: $stage"
            fi
            echo
            cat /data/stages.csv 2>/dev/null || echo "no stage log"
            echo
            python3 scripts/peak-from-samples.py /data/samples.csv --label "$region" \
              2>&1 || echo "no samples to read"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /data/telemetry
          cp /data/samples.csv /data/stages.csv /data/stage.current \
             /data/tiles.log /data/admins.log /data/out/build-metrics.json \
             /data/telemetry/ 2>/dev/null || true
          ls -la /data/telemetry/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: telemetry
          path: /data/telemetry/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: country-tiles
          path: |
            /data/out/*-tiles.tar
            /data/out/*-tiles.json
            /data/cuts-output.txt
          retention-days: 2
          if-no-files-found: warn

  publish:
    # A run against a candidate dataset proves the dataset; it must not ship the graph it built.
    if: ${{ (inputs.timezone || 'vendored') == 'vendored' }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: upload to the tiles release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tiles >/dev/null 2>&1 || gh release create tiles \
            --title "country tiles" \
            --notes "Per-country Valhalla tiles, cut from one build so they reassemble. Map data © OpenStreetMap contributors, ODbL."
          find incoming -name '*-tiles.tar' -exec gh release upload tiles {} --clobber \;
          # The per-country manifests too, not only the archives. They carry every tile's hash —
          # which is what makes reference counting and per-tile delta updates possible on the car
          # — plus the gates' verdicts. Without them a published graph cannot say what it was
          # built from once the workflow run expires.
          find incoming -name '*-tiles.json' -exec gh release upload tiles {} --clobber \;

      - name: promote
        run: |
          pip install --quiet pyyaml
          python3 scripts/manifest-tiles.py incoming index-tiles.json

      - name: commit the manifest
        run: |
          git config user.name "maps factory"
          git config user.email "maps@users.noreply.github.com"
          git add index-tiles.json
          git diff --cached --quiet || git commit -m "tiles: $(date -u +%Y-%m-%d)"
          git push
