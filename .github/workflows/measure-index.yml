name: ДИАГНОСТИКА — замер сборки поискового индекса

# НЕ СПОСОБ СБОРКИ. Этот прогон ничего не публикует, не трогает manifest.json и не создаёт
# пакет страны. Он существует, чтобы ответить на один вопрос, который нельзя решить рассуждением:
# КАКОГО РАЗМЕРА получается поисковый индекс большой страны и во что он обходится по памяти.
#
# Почему это отдельный workflow, а не режим фабрики: временный измерительный прогон, вросший в
# производственный конвейер, перестаёт быть временным и становится вторым способом собирать то же
# самое. Когда ответ получен и формат индекса решён — этот файл удаляется.
#
# Что уже известно и не требует прогона:
#   обе распаковки Германии            52 с        (измерено прошлым прогоном)
#   de.pmtiles z0-14                   3.5 ГБ
#   заготовка z15                      7.2 ГБ
#   тайлов z15 в коробке Германии      962 550
#   индексатор                         0.384 мс на тайл против 64.2 мс у прежнего
# Неизвестно и меряется здесь: размер de-index.json, число записей, пик RSS.

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Код страны из regional.json"
        required: true
        default: "DE"

permissions:
  contents: read        # НИЧЕГО НЕ ПИШЕТ. Ни релиза, ни манифеста, ни коммита.

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: место
        run: |
          rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android || true
          df -h / | tail -1

      - name: границы страны
        id: box
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          code = os.environ["COUNTRY"].upper()
          cfg = json.load(open("regional.json", encoding="utf-8"))
          box = cfg["countries"][code]["bbox"]
          print("code=%s" % code)
          print("low=%s" % code.lower())
          print("bbox=%s" % ",".join(str(x) for x in box))
        env:
          COUNTRY: ${{ github.event.inputs.country }}

      - name: инструмент
        run: |
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz"
          mkdir -p "$RUNNER_TEMP/tools"
          tar -xzf /tmp/pmtiles.tar.gz -C "$RUNNER_TEMP/tools" pmtiles
          chmod +x "$RUNNER_TEMP/tools/pmtiles"

      # Распаковки разделены на два шага НАМЕРЕННО. Прошлый прогон держал обе и сборку индекса в
      # одном состоянии `карта и индекс`, и два часа нельзя было понять, что именно идёт.
      - name: '[1/3] распаковка z0-14'
        run: |
          BUILD=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json |
            python3 -c 'import json,sys; print(sorted(d["key"] for d in json.load(sys.stdin))[-1])')
          echo "$BUILD" > "$RUNNER_TEMP/build.txt"
          IFS=, read -r W S E N <<< "${{ steps.box.outputs.bbox }}"
          start=$(date +%s)
          "$RUNNER_TEMP/tools/pmtiles" extract "https://build.protomaps.com/$BUILD" \
            "$RUNNER_TEMP/${{ steps.box.outputs.low }}.pmtiles" \
            --bbox="$W,$S,$E,$N" --maxzoom=14 --download-threads=8 2>&1 | grep -v 'fetching chunks' || true
          echo "   секунд: $(( $(date +%s) - start ))"
          ls -l "$RUNNER_TEMP/${{ steps.box.outputs.low }}.pmtiles"

      - name: '[2/3] распаковка z15 (заготовка для индекса)'
        run: |
          BUILD=$(cat "$RUNNER_TEMP/build.txt")
          IFS=, read -r W S E N <<< "${{ steps.box.outputs.bbox }}"
          start=$(date +%s)
          "$RUNNER_TEMP/tools/pmtiles" extract "https://build.protomaps.com/$BUILD" \
            "$RUNNER_TEMP/detail.pmtiles" \
            --bbox="$W,$S,$E,$N" --maxzoom=15 --download-threads=8 2>&1 | grep -v 'fetching chunks' || true
          echo "   секунд: $(( $(date +%s) - start ))"
          ls -l "$RUNNER_TEMP/detail.pmtiles"
          df -h / | tail -1

      # ГЛАВНЫЙ ШАГ. `/usr/bin/time -v` даёт Maximum resident set size — то, ради чего прогон.
      - name: '[3/3] сборка индекса, с замером памяти'
        run: |
          start=$(date +%s)
          /usr/bin/time -v python3 scripts/build-index.py \
            "$RUNNER_TEMP/${{ steps.box.outputs.low }}-index.json" \
            --places "$RUNNER_TEMP/${{ steps.box.outputs.low }}.pmtiles" \
            --detail "$RUNNER_TEMP/detail.pmtiles" \
            --bbox "${{ steps.box.outputs.bbox }}" \
            --places-zoom 10 --detail-zoom 15 2> "$RUNNER_TEMP/time.txt" || true
          echo "секунд: $(( $(date +%s) - start ))" | tee -a "$RUNNER_TEMP/time.txt"
          cat "$RUNNER_TEMP/time.txt"

      - name: что получилось
        run: |
          python3 - "$RUNNER_TEMP" "${{ steps.box.outputs.low }}" "${{ steps.box.outputs.bbox }}" <<'PY'
          import json, os, sys, unicodedata, re
          from collections import Counter
          temp, low, bbox = sys.argv[1:4]
          W, S, E, N = (float(v) for v in bbox.split(","))
          path = os.path.join(temp, "%s-index.json" % low)

          print("=" * 78)
          print("РАЗМЕРЫ")
          for name in ("%s.pmtiles" % low, "detail.pmtiles", "%s-index.json" % low):
              p = os.path.join(temp, name)
              if os.path.isfile(p):
                  print("   %-22s %14d байт  %8.1f МБ"
                        % (name, os.path.getsize(p), os.path.getsize(p) / 1048576))

          index = json.load(open(path, encoding="utf-8"))
          counts = index["counts"]
          total = sum(counts.values())
          print()
          print("ЗАПИСИ: всего %d   places %d   streets %d   pois %d"
                % (total, counts["places"], counts["streets"], counts["pois"]))
          print("   по категориям: %s"
                % dict(Counter(p["c"] for p in index["pois"] if "c" in p).most_common()))

          # Свёртка та же, что в приложении (SearchIndex.fold): нижний регистр без диакритики.
          marks = re.compile(r"[̀-ͯ]")
          fold = lambda t: marks.sub("", unicodedata.normalize("NFD", t.lower()))

          print()
          print("ПОИСК — то же сворачивание, что у приложения")
          for needle in ("Munich", "München", "Nürnberg", "Berlin"):
              key = fold(needle)
              hits = [e for section in ("places", "streets", "pois")
                      for e in index[section] if key in fold(e.get("n", ""))]
              inside = sum(1 for h in hits if W <= h["x"] <= E and S <= h["y"] <= N)
              print("   %-10s найдено %5d, из них внутри коробки страны %5d" % (needle, len(hits), inside))
              for h in hits[:3]:
                  print("        %-38s %9.5f %9.5f %s"
                        % (h.get("n", "")[:38], h["y"], h["x"],
                           "ok" if W <= h["x"] <= E and S <= h["y"] <= N else "ВНЕ КОРОБКИ"))

          print()
          print("ЦЕНА В ПАМЯТИ ANDROID — оценка по фактическому индексу, не замер на устройстве.")
          # Что реально держит SearchIndex: List<Entry> целиком, у каждой Entry name и folded
          # (две строки), плюс на время загрузки MutableSet<String> из форматированных ключей.
          names = sum(len(e.get("n", "")) for s in ("places", "streets", "pois") for e in index[s])
          # Строка в JVM: заголовок 16 + ссылка на byte[] + сам массив (Latin-1 при ASCII, иначе 2
          # байта на символ). Считаем по верхней границе — имена сплошь с диакритикой.
          str_bytes = names * 2 + total * 2 * 40          # name + folded, по 40 байт накладных
          entry_bytes = total * 48                        # объект Entry + LatLng
          key_bytes = total * (60 + 40)                   # ключ seen: "kind|folded|%.4f|%.4f"
          print("   записей            %10d" % total)
          print("   имена, символов    %10d" % names)
          print("   Entry + LatLng     %10.0f МБ" % (entry_bytes / 1048576))
          print("   name + folded      %10.0f МБ" % (str_bytes / 1048576))
          print("   List<Entry>        %10.0f МБ" % (total * 8 / 1048576))
          print("   -- постоянно       %10.0f МБ" % ((entry_bytes + str_bytes + total * 8) / 1048576))
          print("   seen (только загрузка) %6.0f МБ" % (key_bytes / 1048576))
          print("   -- пик загрузки    %10.0f МБ"
                % ((entry_bytes + str_bytes + total * 8 + key_bytes) / 1048576))
          print("=" * 78)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: measure-index-${{ steps.box.outputs.low }}
          path: |
            ${{ runner.temp }}/${{ steps.box.outputs.low }}-index.json
            ${{ runner.temp }}/time.txt
          retention-days: 7
          if-no-files-found: error
