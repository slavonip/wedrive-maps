# The charging catalogue (owner, 2026-11-21): every charger in the regional.json countries, from
# the Open Charge Map API and OpenStreetMap, as ONE file — charging.sqlite, format
# wedrive-charging/1 — published as a release asset and written into the production manifest
# (manifest.json "charging"), from where the app downloads it itself.
#
#   build:   tests -> OCM fetch (secret OCM_API_KEY) -> OSM extract (europe + russia, dated, md5)
#            -> charging-build.py build + validate against the previous release -> artifact
#   publish: draft -> upload -> download back -> sha256 -> (verify: delete the draft |
#            publish: publish -> manifest.json "charging" -> push, 3 rebase retries)
#   report:  an issue when a scheduled or publish run fails
#
# One file for Europe, not one per country: the EV planner needs chargers in countries the car has
# not installed, and deleting a country must not take its chargers away. OCM changes on its own
# schedule, so this workflow is independent of the map and graph factories: a charging failure
# touches no map, and a map failure touches no charger.
#
# Licences never mix in one row: a station row is ONE source record under ONE source row (ODbL for
# OSM, the provider's own licence for each OCM provider, charging/providers.json). The factory only
# assigns clusters; the app merges what it shows.
name: charging factory

on:
  # TEMPORARY (2026-11-21): a push to this branch runs a DRY build — publish and report only run on
  # schedule / verify / publish. Needed because workflow_dispatch requires the file on main. Remove before merge.
  push:
    branches: [charging-p0]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = build and gate only; verify = also upload a draft, check it, delete it; publish = publish and move the manifest"
        type: choice
        options: [dry, verify, publish]
        default: dry
  schedule:
    - cron: "17 3 6 * *"   # 6th, 03:17 UTC — after Europe Lite (3rd) and the regional factory (4th)

permissions:
  contents: write

# SAME group as the regional factory and the WORLD overview: all three commit manifest.json, and
# one must never rebase its manifest over another's in the middle of a run.
concurrency:
  group: regional-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: tests (offline, on fixtures)
        run: python3 tests/test_charging.py
      - name: tools and disk
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
          osmium --version | head -1; python3 --version; df -h / "$RUNNER_TEMP"
          echo "WORK=$RUNNER_TEMP/charging" >> "$GITHUB_ENV"
      # The key exists ONLY as the Actions secret. It goes into the X-API-Key header and nowhere
      # else (never a URL, never a log line); add-mask hides it should anything ever print it.
      - name: OCM fetch
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$OCM_API_KEY" ] || { echo "::error::secret OCM_API_KEY is not set"; exit 1; }
          echo "::add-mask::$OCM_API_KEY"
          python3 scripts/charging-ocm-fetch.py regional.json "$WORK/ocm"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("requests", r["requests"], "total", r["total"]); [print("  %-3s %6d  pages %d  ids %s..%s  status %s  provider %s" % (c, v["count"], v["pages"], v["min_id"], v["max_id"], v["status"], v["provider"])) for c, v in sorted(r["countries"].items())]' "$WORK/ocm/report.json"
      - name: OSM extract (europe + russia)
        run: |
          set -euo pipefail
          base="$WORK"
          WORK="$base/osm-work" bash scripts/charging-osm-extract.sh "$base/osm"
      - name: build
        id: build
        run: |
          set -euo pipefail
          python3 scripts/charging-build.py build regional.json "$WORK/ocm" "$WORK/osm" "$WORK/out"
          echo "build=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["build"])' "$WORK/out/charging.json")" >> "$GITHUB_OUTPUT"
          cat "$WORK/out/charging.json"
      - name: gates (against the release in manifest.json now)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/live-manifest.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/previous-manifest.json"
          python3 scripts/charging-build.py validate "$WORK/out" regional.json "$RUNNER_TEMP/previous-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: charging
          retention-days: 7
          path: |
            ${{ env.WORK }}/out/charging.sqlite.gz
            ${{ env.WORK }}/out/charging.json
            ${{ env.WORK }}/out/report.json
            ${{ env.WORK }}/ocm/*.jsonl.gz
            ${{ env.WORK }}/ocm/report.json
            ${{ env.WORK }}/ocm/referencedata.json
            ${{ env.WORK }}/osm/osm.geojsonseq
            ${{ env.WORK }}/osm/osm-source.json

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.mode == 'verify' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: charging
          path: ${{ runner.temp }}/in
      - name: draft -> upload -> download back -> sha256 -> (delete | publish -> manifest.json)
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/in"
          OUT=$(dirname "$(find "$IN" -name charging.json | head -1)")
          TAG="charging-$BUILD"
          [ "$MODE" = verify ] && TAG="$TAG-verify-$GITHUB_RUN_ID"
          sha=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$OUT/charging.json")
          size=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["bytes"])' "$OUT/charging.json")
          [ "$(sha256sum "$OUT/charging.sqlite.gz" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::artifact does not match charging.json"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — a catalogue is never replaced under the same tag"; exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --title "Charging catalogue $BUILD" \
            --notes "wedrive-charging/1. Charging stations © OpenStreetMap contributors (ODbL 1.0) and Open Charge Map (openchargemap.org) contributors and data providers — CC BY 4.0 and each provider's own licence (charging/providers.json; the licence of every record is on its own source row)."
          gh release upload "$TAG" "$OUT/charging.sqlite.gz" --repo "$GITHUB_REPOSITORY"
          # the uploaded asset must be what was built, byte for byte, before anything moves
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p charging.sqlite.gz -D "$RUNNER_TEMP/back"
          got=$(sha256sum "$RUNNER_TEMP/back/charging.sqlite.gz" | cut -d' ' -f1)
          if [ "$got" != "$sha" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            echo "::error::uploaded asset sha256 $got, built $sha — draft deleted, manifest NOT moved"; exit 1
          fi
          if [ "$MODE" = verify ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "verify: draft $TAG uploaded, checked ($sha) and deleted"; exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/charging.sqlite.gz"
          gotsize=$(curl -sfIL "$URL" | awk 'tolower($1)=="content-length:"{v=$2} END{gsub("\r","",v); print v}')
          [ "$gotsize" = "$size" ] || { echo "::error::$URL: size $gotsize, expected $size — manifest NOT moved"; exit 1; }
          python3 scripts/live-manifest.py "$GITHUB_REPOSITORY" manifest.json
          python3 scripts/charging-manifest.py manifest.json "$OUT/charging.json" "$URL"
          git add manifest.json
          git -c user.name="wedrive-factory" -c user.email="factory@users.noreply.github.com" \
              commit -q -m "Charging catalogue -> $TAG ($size bytes)"
          pushed=""
          for _ in 1 2 3; do
            if git pull -q --rebase --autostash && git push -q; then pushed=1; break; fi
            sleep 5
          done
          [ -n "$pushed" ] || { echo "::error::manifest push failed three times: $TAG is published, manifest.json unchanged"; exit 1; }
          echo "manifest.json charging -> $TAG"
          # keep the last three charging releases; older ones go (rollback = repoint the block)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | grep -E '^charging-[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort -r | tail -n +4 \
            | while read -r old; do
                echo "pruning $old"; gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done

  report:
    needs: [build, publish]
    if: always() && (needs.build.result == 'failure' || needs.publish.result == 'failure') && (github.event_name == 'schedule' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "charging factory failed ($(date -u +%F))" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — build: ${{ needs.build.result }}, publish: ${{ needs.publish.result }}. manifest.json \"charging\" was not moved; the car keeps the previous catalogue."
