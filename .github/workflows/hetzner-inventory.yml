name: hetzner inventory (temporary, read-only)

# MASTER TASK block 3 (2026-09-26): list everything in the Hetzner Cloud project before it is
# decommissioned. GET only (scripts/hetzner-inventory.py), manual dispatch only, never scheduled.
# Deleted together with the other Hetzner files once the owner has revoked the token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: read-only inventory
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: python3 scripts/hetzner-inventory.py | tee /tmp/inventory.txt
      - name: summary
        if: always()
        run: |
          { echo '### Hetzner inventory'; echo '```'; cat /tmp/inventory.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
