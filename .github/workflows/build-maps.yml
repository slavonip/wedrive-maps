name: build maps

# Monthly, and by hand when a region is added. Nothing here needs a computer of ours: the point
# of the whole arrangement is that adding a country is one entry in regions.yml and the rest
# happens on someone else's cores (see README).
on:
  schedule:
    - cron: "17 2 1 * *"        # 02:17 UTC on the 1st — overnight for this car's timezone
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Space-separated package ids. Empty builds the named list in regions.yml.
          An id need not be listed: md-ro-ua is derived from its country codes, so planning a
          trip through a new combination is a dispatch, not a commit. The countries themselves
          must have blocks under `countries:` — if one does not, this fails in a second and
          says which.
        required: false
        default: ""

concurrency:
  group: build-maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.read.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      # COVERAGE FIRST, in one second, before any four-hour build. A package whose countries
      # have no probes is refused here rather than shipping on "it built" — which is exactly
      # what the first md-ro build did: every probe in it pointed at Chișinău while Romania was
      # half the bytes and was asserted by nothing.
      - name: every package is covered by probes
        run: |
          pip install --quiet pyyaml
          python3 scripts/probe-plan.py --check-all

      - id: read
        run: python3 scripts/plan.py "${{ inputs.packages }}" >> "$GITHUB_OUTPUT"

      # EVERYTHING downstream needs about each package, computed once, here, where PyYAML lives.
      # The Valhalla image has no PyYAML and no pip to install one; teaching it would be one more
      # thing that must be reachable at 02:17. Every later job reads plain JSON instead.
      - name: derive each package's plan
        run: |
          python3 scripts/probe-plan.py --all-plans plan ${{ inputs.packages }}

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan/
          retention-days: 2

  # ── the routing graph: Valhalla's own image, because only it carries the tools ────────────
  graph:
    needs: plan
    # The job NAME carries the package, because GitHub's failure email says only which job
    # failed. "graph (md-ro)" in the subject line is free; anything richer has to be an issue,
    # which is what the report job below opens.
    name: graph (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one country failing must not stop the others
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    # PINNED, never :latest. On 2026-09-17 the floating tag lost `pkg-config` and the build died
    # at a step that had worked for weeks — a monthly job must not change toolchain under us.
    container:
      image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
      options: --user root
    defaults:
      run:
        # The container's default shell is `sh -e`, which is NOT bash: PIPESTATUS, arrays and
        # [[ ]] all quietly do the wrong thing. Found 2026-09-17 while fixing a failure three
        # steps earlier — this would have been the next one to bite.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The runner's ~14 GB of free disk is the real ceiling here, not CPU. Clearing what the
      # image ships with buys back several gigabytes and is the difference between building
      # Romania and failing halfway through writing tiles.
      - name: reclaim disk
        run: |
          df -h / | tail -1
          rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan

      # THE TIMEZONE DATABASE IS OURS TO SUPPLY, not a third party's to be up at 02:17.
      # `valhalla_build_timezones` downloads a shapefile from someone else's GitHub release; on
      # 2026-09-17 that fetch failed, the build carried on as designed, and the package was
      # correctly refused promotion for having no timezones. A monthly unattended job must not
      # lose a month to that, so the file rides in our own rolling release.
      #
      # PLAIN CURL, NOT `gh`. This image has no GitHub CLI — measured the same day, on a run
      # where `gh: not found` was swallowed by a `|| echo` and the step reported success having
      # done nothing whatsoever. The release is public, so no token is wanted either.
      - name: vendored timezone database
        run: |
          mkdir -p /data/vendor
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/maps-vendor"
          if curl -fsSL -o /data/vendor/timezones.sqlite "$base/timezones.sqlite" &&
             curl -fsSL -o /data/vendor/timezones.version "$base/timezones.version"; then
            echo "vendored timezones $(cat /data/vendor/timezones.version)," \
                 "$(stat -c%s /data/vendor/timezones.sqlite) bytes"
          else
            # Tolerated, never silent: the build goes on and the gate refuses to promote a
            # package with no timezones, so the cost is a stale month, not a wrong arrival time.
            rm -f /data/vendor/timezones.sqlite
            echo "::warning::no vendored timezone database; this package cannot be promoted"
          fi

      - name: build
        run: |
          mkdir -p /data
          cp -r scripts /data/scripts
          regions=$(python3 -c "
          import json
          print(*json.load(open('plan/${{ matrix.package }}.json'))['regions'])")
          echo "regions: $regions"
          bash /data/scripts/build-graph.sh "${{ matrix.package }}" $regions

      # THE GATE. A graph that builds is not a graph that routes: the car's runtime has no
      # version check and will happily read a graph missing half a country. Only a route with a
      # known answer proves anything (§7's probes).
      - name: probe
        run: |
          set +e
          python3 scripts/probe.py "/data/valhalla_${{ matrix.package }}.json" \
            "plan/${{ matrix.package }}.json" 2>&1 | tee /data/probe-output.txt
          exit "${PIPESTATUS[0]}"

      # WHICH probe failed, one click from the run — and on a PASSING run too, so this month's
      # numbers can be compared with next month's.
      - name: report the probes
        if: always()
        run: |
          {
            echo "### graph: ${{ matrix.package }}"
            echo
            echo '```'
            cat /data/probe-output.txt 2>/dev/null || echo "the probes did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `always()`, so a FAILED gate's output still reaches the report job — which is the whole
      # reason that job exists.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-${{ matrix.package }}
          path: |
            /data/out/${{ matrix.package }}.tar
            /data/out/${{ matrix.package }}-graph.json
            /data/probe-output.txt
          retention-days: 2
          if-no-files-found: warn

  # ── the basemap: a plain runner, because go-pmtiles is not in Valhalla's image ────────────
  #
  # A package is TWO artifacts and this is the one the driver looks at. It was missing entirely
  # until 2026-09-17: the publish step already knew how to upload a `.pmtiles` and nothing in
  # the factory ever produced one, so `md-ro` was a routing graph for a country with no map
  # under it. The routing probes could never have caught that — every one of them calls
  # `valhalla_service route`.
  basemap:
    needs: plan
    name: basemap (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: reclaim disk
        run: |
          rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android || true
          df -h / | tail -1

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan

      # NOT /data. This job is not in a container and the runner user cannot write the root —
      # measured 2026-09-17: "mkdir: cannot create directory '/data': Permission denied". The
      # graph job can, because its container runs --user root. That difference is exactly the
      # kind that makes one path work in one job and fail in the next.
      - name: extract
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          read -r W S E N <<< "$(python3 -c "
          import json
          print(*json.load(open('plan/${{ matrix.package }}.json'))['bbox'])")"
          echo "bbox: $W $S $E $N"
          OUT_DIR="$RUNNER_TEMP/out" WORK="$RUNNER_TEMP" \
            bash scripts/build-basemap.sh "${{ matrix.package }}" "$W" "$S" "$E" "$N"

      # THE OTHER GATE, and its failure mode is the nastier one: a style pointed at the wrong
      # vector schema renders NOTHING and reports no error at all (§13).
      - name: probe
        run: |
          set +e
          python3 scripts/probe-basemap.py "$RUNNER_TEMP/out/${{ matrix.package }}.pmtiles" \
            "plan/${{ matrix.package }}.json" "$RUNNER_TEMP/tools/pmtiles" \
            2>&1 | tee "$RUNNER_TEMP/basemap-output.txt"
          exit "${PIPESTATUS[0]}"

      - name: report the probes
        if: always()
        run: |
          {
            echo "### basemap: ${{ matrix.package }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/basemap-output.txt" 2>/dev/null || echo "the probes did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basemap-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/out/${{ matrix.package }}.pmtiles
            ${{ runner.temp }}/out/${{ matrix.package }}-basemap.json
            ${{ runner.temp }}/basemap-output.txt
          retention-days: 2
          if-no-files-found: warn

  # ── say what broke, somewhere a person actually reads ─────────────────────────────────────
  #
  # ON THE RUNNER, not in the container, because `gh` exists here and does not exist there.
  # GitHub's failure email cannot carry custom text — the subject is always "Run failed: build
  # maps" and the body is a link — so an issue is the only way to put the probe table in front
  # of someone by email, and it leaves a record that outlives the 90-day log retention.
  report:
    needs: [graph, basemap]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          {
            echo "A package did not pass its probes and was **not promoted**."
            echo "Every car keeps last month's data until this is fixed."
            echo
            for out in $(find incoming -name '*-output.txt' | sort); do
              echo "### ${out#incoming/}"
              echo '```'
              cat "$out"
              echo '```'
              echo
            done
            for meta in $(find incoming -name '*.json' | sort); do
              echo "<details><summary>${meta#incoming/}</summary>"
              echo
              echo '```json'
              cat "$meta"
              echo '```'
              echo
              echo "</details>"
            done
            echo
            echo "[Full log]($RUN_URL)"
          } > "$body"
          gh issue create --repo "$REPO" \
            --title "maps: a package failed its probes ($(date -u +%Y-%m-%d))" \
            --body-file "$body"

  publish:
    needs: [plan, graph, basemap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Every artifact, the plan included: the country list and title live there and nowhere
      # else, which is why the first index.json this factory wrote had `"countries": []`.
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      # Names every artifact `<package>-<dataDate>.<ext>` first, which is what makes §17's
      # rollback possible at all — `--clobber` on a fixed name ate the previous build, so there
      # was nothing to roll back to. Then cuts anything over GitHub's 2 GiB per-asset cap into
      # parts; a release has no total size or bandwidth limit, so only the per-asset one is real.
      - name: name and split assets
        run: python3 scripts/split-assets.py incoming

      - name: upload to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps >/dev/null 2>&1 || \
            gh release create maps --title "maps" --notes "Rolling map artifacts. See index.json."
          find incoming -type f \( -name '*.tar' -o -name '*.tar.part*' -o -name '*.pmtiles' \) \
            -exec gh release upload maps {} --clobber \;

      # PUBLISH AND PROMOTE ARE DIFFERENT ACTS. The assets can sit in the release while no car
      # sees them; index.json is what the cars read, and it only moves for packages whose probes
      # passed. A failed build therefore leaves every car on last month's data rather than on a
      # graph nobody drove.
      - name: promote
        run: |
          pip install --quiet pyyaml
          python3 scripts/manifest.py incoming index.json

      - name: commit the manifest
        run: |
          git config user.name "maps factory"
          git config user.email "maps@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "maps: $(date -u +%Y-%m-%d)"
          git push

      # Three months of history: enough for a rollback, short enough that the release page stays
      # readable. Runs AFTER the manifest is committed, so whatever index.json points at is by
      # definition safe from it.
      - name: prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune-release.py 3
