# The regional engine the country factory runs, pinned by DIGEST (never by the mutable tag).
# Read by scripts/regional-precheck.py; the factory container is exactly this image, and its first
# step proves that the Valhalla sources inside are engine_sha.
#
# engine_ref  tag of slavonip/wedrive-valhalla the image was built from (docker/engine.Dockerfile)
# engine_sha  the commit that tag resolves to; written into the image as /etc/wedrive-engine-sha
# image       the digest. 20589a75 = engine-image run 36267711959 (2026-09-26): the same engine
#             (engine_sha unchanged, so no country is rebuilt for it) plus frontier_dump. Checked
#             from GHCR by digest: engine sha, gid_test all green, and the frontier of MD 2026-09-24
#             built inside it is byte-identical to the one the D1 tests use (8aa7f5ad...).
#             Before it: a758968c (run 35460641774), which built regional-2026-09-20-8 and
#             regional-2026-09-26-13 and has no frontier_dump. A new engine is a reviewed commit to
#             this file, and a changed engine_sha makes the precheck rebuild every country.
engine_ref = multi-region-runtime-v2
engine_sha = 509825eba4147daf2b4ff3b5c4ecf78b4f77ab6e
image      = ghcr.io/slavonip/wedrive-engine@sha256:20589a751998db1c60775a210eab036b5a8bd5a0e4594fd714b70ef99d26be41

# Timezone database for every country graph: the promoted dataset of the maps-vendor release,
# the same file Europe Lite uses. Checked by sha before any build; a mismatch fails the run.
timezones_url    = https://github.com/slavonip/wedrive-maps/releases/download/maps-vendor/timezones.sqlite
timezones_sha256 = 5027ecd793c88036acae9d400daeb9be7b43627fe2430e19cf9b9d08e29907e4
